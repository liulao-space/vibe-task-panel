<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vibe Task Panel</title>
<link rel="icon" href="/favicon.ico" />
<style>
/* ============================================================
   Design Tokens
   ============================================================ */
:root{
  --bg:#08090a;
  --bg-grad:radial-gradient(1200px 520px at 18% -8%, rgba(31,155,134,.20), transparent 60%),
            radial-gradient(900px 420px at 92% 0%, rgba(78,161,255,.07), transparent 55%);
  --surface:#0e0f11;
  --panel:#111214;
  --panel-2:#16181b;
  --panel-3:#1c1f23;
  --border:#212429;
  --border-2:#2c3036;
  --border-glow:rgba(255,255,255,.09);
  --text:#f2f3f5;
  --text-2:#9aa1ad;
  --text-3:#6a7280;
  --accent:#3fc1a9;
  --accent-2:#1f9b86;
  --accent-soft:rgba(63,193,169,.14);
  --todo:#7c828d;
  --prog:#4ea1ff;
  --review:#e5b23c;
  --done:#63bf6a;
  --block:#f2555a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 8px 24px -8px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.35);
  --shadow-lg:0 24px 64px -16px rgba(0,0,0,.8);
  --r-sm:6px; --r:9px; --r-lg:14px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
html[data-theme="light"]{
  --bg:#fbfbfc;
  --bg-grad:radial-gradient(1100px 480px at 15% -10%, rgba(31,155,134,.12), transparent 60%);
  --surface:#ffffff;
  --panel:#ffffff;
  --panel-2:#f6f7f9;
  --panel-3:#eef0f4;
  --border:#e4e6eb;
  --border-2:#d6d9e0;
  --border-glow:rgba(0,0,0,.06);
  --text:#14161a;
  --text-2:#5a626e;
  --text-3:#878e99;
  --accent:#12876f;
  --accent-2:#0d6f5b;
  --accent-soft:rgba(18,135,111,.10);
  --todo:#8b929c; --prog:#2f80ed; --review:#b7830f; --done:#2f8f45; --block:#d93a3f;
  --shadow:0 8px 24px -12px rgba(20,22,26,.18), 0 1px 3px rgba(20,22,26,.08);
  --shadow-lg:0 24px 60px -18px rgba(20,22,26,.24);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--bg);background-image:var(--bg-grad);
  background-attachment:fixed;color:var(--text);font-size:13.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
::selection{background:rgba(63,193,169,.32)}
.hidden{display:none !important}
.mono{font-family:var(--mono)}
.muted{color:var(--text-3)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   App shell
   ============================================================ */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}

/* ---------- Sidebar ---------- */
.sidebar{
  background:rgba(14,15,17,.72);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;backdrop-filter:blur(12px);
}
html[data-theme="light"] .sidebar{background:rgba(255,255,255,.75)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.logo{
  width:30px;height:30px;border-radius:8px;flex:0 0 30px;
  display:grid;place-items:center;
}
.logo img{width:30px;height:30px;display:block}
.logo .logo-icon{border-radius:7px}
.logo .logo-mark{display:none}
html[data-theme="light"] .logo .logo-mark{display:block}
html[data-theme="light"] .logo .logo-icon{display:none}
.brand-txt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-name{color:var(--accent);font-weight:800;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap}
.brand-sub{font-size:10.5px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-scroll{flex:1;overflow-y:auto;padding:4px 10px 14px;min-height:0}
.sb-label{
  font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);padding:14px 8px 6px;display:flex;align-items:center;justify-content:space-between;
}
.sb-label button{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:14px;line-height:1;padding:0 2px;border-radius:4px}
.sb-label button:hover{color:var(--text);background:var(--panel-2)}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:6.5px 9px;border-radius:var(--r-sm);
  color:var(--text-2);cursor:pointer;font-size:13px;position:relative;user-select:none;
  transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--panel-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--text);font-weight:550}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);width:2.5px;height:16px;border-radius:0 2px 2px 0;background:var(--accent)}
.nav-item .ico{width:16px;text-align:center;font-size:13px;opacity:.9;flex:0 0 16px}
.nav-item .n{margin-left:auto;font-size:11px;color:var(--text-3);font-family:var(--mono);
  background:var(--panel-2);border:1px solid var(--border);border-radius:999px;padding:0 6px;min-width:20px;text-align:center}
.nav-item.active .n{background:rgba(63,193,169,.18);border-color:transparent;color:var(--accent)}
.nav-item .n.warn{color:var(--review);border-color:rgba(229,178,60,.3);background:rgba(229,178,60,.12)}

.req-item{padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;transition:background .12s}
.req-item:hover{background:var(--panel-2)}
.req-item.active{background:var(--panel-2)}
.req-top{display:flex;align-items:center;gap:7px}
.req-dot{width:7px;height:7px;border-radius:2px;flex:0 0 7px}
.req-name{font-size:12.5px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.req-cnt{font-size:10.5px;color:var(--text-3);font-family:var(--mono)}
.req-bar{height:3px;border-radius:2px;background:var(--panel-3);margin-top:6px;overflow:hidden;display:flex}
.req-bar i{display:block;height:100%}
.sb-foot{border-top:1px solid var(--border);padding:10px;display:flex;flex-direction:column;gap:6px}
.cmd-hint{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-3);padding:2px 4px}
kbd{font-family:var(--mono);font-size:10px;background:var(--panel-2);border:1px solid var(--border);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--text-2)}
.test-menu-head{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--text-2);
  padding:6px 8px;cursor:pointer;border-radius:7px;user-select:none}
.test-menu-head:hover{background:var(--panel-2)}
.test-menu-head .caret{margin-left:auto;font-size:9px;color:var(--text-3);transition:transform .15s}
.test-menu.open .caret{transform:rotate(90deg)}
.test-menu-body{display:flex;flex-direction:column;gap:2px;padding:2px 2px 4px}
.test-menu-body.hidden{display:none}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.topbar{
  height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 18px;
  border-bottom:1px solid var(--border);background:rgba(8,9,10,.6);backdrop-filter:blur(14px);z-index:20;
}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.7)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0}
.crumb h1{font-size:14.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.crumb .sep{color:var(--text-3)}
.crumb .sub{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:2px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:2.5px}
.seg button{background:none;border:none;color:var(--text-2);padding:4px 11px;border-radius:6px;cursor:pointer;font-size:12.5px;transition:.12s;white-space:nowrap}
.seg button:hover{color:var(--text)}
.seg button.active{background:var(--panel-3);color:var(--text);box-shadow:var(--shadow-sm)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{
  display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:5px 10px;width:250px;transition:border-color .15s, box-shadow .15s;
}
.search:focus-within{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.search input{background:none;border:none;outline:none;width:100%;font-size:12.5px;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--text-2);
  border:1px solid var(--border);border-radius:7px;padding:5.5px 11px;cursor:pointer;font-size:12.5px;
  transition:.13s;white-space:nowrap;
}
.btn:hover{color:var(--text);border-color:var(--border-2);background:var(--panel-2)}
.btn:active{transform:translateY(.5px)}
.btn.icon{padding:5.5px 8px}
.btn.primary{
  background:linear-gradient(180deg,#2fb99c,#1a9483);border-color:#177f70;color:#fff;font-weight:550;
  box-shadow:0 2px 10px -2px rgba(31,155,134,.55);
}
.btn.primary:hover{background:linear-gradient(180deg,#3cc7a8,#1fa38f);color:#fff}
.btn.ok{color:var(--done);border-color:rgba(99,191,106,.32)}
.btn.ok:hover{background:rgba(99,191,106,.1);border-color:var(--done)}
.btn.danger{color:var(--block);border-color:rgba(242,85,90,.3)}
.btn.danger:hover{background:rgba(242,85,90,.1);border-color:var(--block)}
.btn.warn{color:var(--review);border-color:rgba(229,178,60,.32)}
.btn.warn:hover{background:rgba(229,178,60,.1)}
.btn.sm{padding:3px 8px;font-size:11.5px;border-radius:6px}
.btn:disabled{opacity:.42;cursor:not-allowed}

.filterbar{
  display:flex;align-items:center;gap:8px;padding:9px 18px;border-bottom:1px solid var(--border);
  background:var(--surface);flex-wrap:wrap;min-height:44px;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);
  color:var(--text-2);border-radius:999px;padding:3px 10px;font-size:11.5px;cursor:pointer;transition:.12s;user-select:none;
}
.chip:hover{border-color:var(--border-2);color:var(--text)}
.chip.on{background:var(--accent-soft);border-color:rgba(63,193,169,.4);color:var(--text)}
.chip .sw{width:7px;height:7px;border-radius:50%}
.chip .k{font-family:var(--mono);font-size:10.5px;opacity:.8}
.divider-v{width:1px;height:18px;background:var(--border)}
.filefilter{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel);
  border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--text-2)}
.filefilter input{background:none;border:none;outline:none;width:110px;font-size:11.5px;color:var(--text)}
.filefilter input::placeholder{color:var(--text-3)}
.content{flex:1;overflow:auto;min-height:0;position:relative}

/* ============================================================
   Kanban
   ============================================================ */
.board{display:flex;gap:12px;padding:16px 18px 24px;align-items:flex-start;min-height:100%}
.column{
  flex:1 1 0;min-width:236px;max-width:340px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 145px);
}
.column.drag-over{border-color:var(--accent-2);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.col-head{display:flex;align-items:center;gap:8px;padding:11px 13px 9px}
.col-head .sw{width:8px;height:8px;border-radius:3px}
.col-title{font-size:12.5px;font-weight:600}
.col-count{font-family:var(--mono);font-size:11px;color:var(--text-3);background:var(--panel-2);
  border-radius:999px;padding:0 6px;border:1px solid var(--border)}
.col-head .gate{margin-left:auto;font-size:10.5px;color:var(--text-3)}
.col-progress{padding:0 13px 8px}
.progress-track{height:4px;background:var(--panel-3);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:3px;transition:width .4s}
.progress-text{font-size:10.5px;color:var(--text-3);margin-top:3px;display:block;font-family:var(--mono)}
.col-body{padding:2px 9px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;min-height:64px}
.col-empty{border:1px dashed var(--border-2);border-radius:var(--r);padding:16px;text-align:center;
  color:var(--text-3);font-size:11.5px}

.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px 11px;
  cursor:pointer;transition:transform .12s,border-color .12s,box-shadow .12s;position:relative;overflow:hidden;flex-shrink:0;
}
.card:hover{border-color:var(--border-2);transform:translateY(-1px);box-shadow:var(--shadow)}
.card.dragging{opacity:.4}
.card.dim{opacity:.35}
.card.hl{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c,transparent)}
.card-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.tid{font-family:var(--mono);font-size:10.5px;color:var(--text-3);letter-spacing:-.01em}
.card-top .spacer{flex:1}
.card-title{font-size:13px;font-weight:520;line-height:1.42;margin-bottom:8px;letter-spacing:-.005em}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.tag{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--panel-3);color:var(--text-2);border:1px solid var(--border)}
.tag.req{background:transparent}
.card-foot{display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--text-3);font-family:var(--mono)}
.card-foot .m{display:flex;align-items:center;gap:3px}
.card-foot .m.hot{color:var(--review)}
.card-foot .av{margin-left:auto;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--sans);font-size:9.5px;font-weight:600;color:#fff;flex:0 0 19px}
.exec-state{font-size:10.5px;margin:6px 0;font-weight:600;font-family:var(--mono)}
.exec-state.running{color:var(--prog)}
.exec-state.pending{color:var(--text-3)}
.exec-state.done{color:var(--done)}
.gate-row{display:flex;gap:3px;margin-bottom:7px}
.gate-pip{flex:1;height:3px;border-radius:2px;background:var(--panel-3)}
.gate-pip.pass{background:var(--done)}
.gate-pip.fail{background:var(--block)}
.gate-pip.run{background:linear-gradient(90deg,var(--review),transparent);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.blocked-note{display:flex;gap:5px;font-size:10.5px;color:var(--block);background:rgba(242,85,90,.09);
  border:1px solid rgba(242,85,90,.2);border-radius:6px;padding:4px 7px;margin-bottom:7px;line-height:1.4}

/* ============================================================
   List / table
   ============================================================ */
.listwrap{padding:14px 18px 26px}
.group{margin-bottom:18px;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.group-head{display:flex;align-items:center;gap:9px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.group-head .nm{font-weight:600;font-size:13px}
.group-head .pill{font-family:var(--mono);font-size:10.5px;color:var(--text-3);border:1px solid var(--border);border-radius:999px;padding:0 7px}
.group-head .prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3)}
.mini-bar{width:110px;height:4px;border-radius:3px;background:var(--panel-3);overflow:hidden;display:flex}
.mini-bar i{height:100%}
.trow{
  display:grid;grid-template-columns:70px 1fr 96px 118px 128px 130px 34px;gap:10px;align-items:center;
  padding:8.5px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;
}
.trow:last-child{border-bottom:none}
.trow:hover{background:var(--panel)}
.trow.head{background:var(--panel-2);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-3);cursor:default;font-weight:600}
.trow.head:hover{background:var(--panel-2)}
.ttitle{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;border:1px solid var(--border);
  border-radius:6px;padding:1.5px 7px;white-space:nowrap;background:var(--panel)}
.badge .sw{width:6px;height:6px;border-radius:50%}
.dep-chip{font-family:var(--mono);font-size:10.5px;border:1px solid var(--border);border-radius:5px;
  padding:0 5px;color:var(--text-2);background:var(--panel-2);margin-right:3px;cursor:pointer}
.dep-chip:hover{border-color:var(--accent-2);color:var(--accent)}
.file-chip{font-family:var(--mono);font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

/* ============================================================
   Graph (DAG)
   ============================================================ */
.graphwrap{position:relative;height:100%;overflow:hidden;background:
  radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0) 0 0/22px 22px;}
.graph-toolbar{
  position:absolute;bottom:16px;left:18px;z-index:6;display:flex;gap:6px;align-items:center;
  background:rgba(17,18,20,.86);border:1px solid var(--border);border-radius:9px;padding:5px;backdrop-filter:blur(10px);
}
html[data-theme="light"] .graph-toolbar{background:rgba(255,255,255,.9)}
.graph-legend{
  position:absolute;bottom:16px;right:18px;z-index:5;background:rgba(17,18,20,.86);border:1px solid var(--border);
  border-radius:9px;padding:9px 11px;font-size:11px;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:5px;
}
html[data-theme="light"] .graph-legend{background:rgba(255,255,255,.9)}
.lg-row{display:flex;align-items:center;gap:7px;color:var(--text-2)}
.lg-line{width:22px;height:0;border-top:2px solid var(--text-3)}
.lg-line.impact{border-top:2px dashed var(--review)}
.graph-svg{display:block;cursor:grab}
.graph-svg:active{cursor:grabbing}
.gnode{cursor:pointer}
.gnode .nbox{fill:var(--panel);stroke:var(--border-2);stroke-width:1.2;transition:.15s}
.gnode:hover .nbox{stroke:var(--accent-2);filter:drop-shadow(0 6px 16px rgba(0,0,0,.55))}
.gnode.sel .nbox{stroke:var(--accent);stroke-width:2}
.gnode.impacted .nbox{stroke:var(--review);stroke-dasharray:4 3}
.gnode.faded{opacity:.22}
.gnode text{font-family:var(--sans);fill:var(--text)}
.gnode .gid{font-family:var(--mono);font-size:14px;fill:var(--text-3)}
.gnode .gtitle{font-size:16px;fill:var(--text)}
.gnode .gmeta{font-size:14px;fill:var(--text-3);font-family:var(--mono)}
.gedge{stroke:var(--border-2);stroke-width:1.6;fill:none;transition:.15s;stroke-linecap:butt}
.gedge.hot{stroke:var(--review);stroke-width:2.2;stroke-dasharray:5 4;animation:dash 20s linear infinite}
.gedge-head{fill:var(--border-2);stroke:none;transition:.15s}
.gedge-head.hot{fill:var(--review)}
.gedge-src{fill:var(--border-2);stroke:none;transition:.15s}
.gedge-src.hot{fill:var(--review)}
.gedge-g.faded{opacity:.15}
@keyframes dash{to{stroke-dashoffset:-200}}
.layer-label{font-family:var(--mono);font-size:10px;fill:var(--text-3)}

/* ============================================================
   Drawer (task detail)
   ============================================================ */
.drawer{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end}
.drawer.hidden{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dpanel{
  position:relative;width:min(860px,88vw);background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .22s cubic-bezier(.22,.9,.3,1);
}
@keyframes slide{from{transform:translateX(28px);opacity:.5}to{transform:none;opacity:1}}
.dhead{padding:14px 20px 0;border-bottom:1px solid var(--border);background:var(--panel)}
.dhead-top{display:flex;align-items:flex-start;gap:12px}
.dhead h2{font-size:16px;font-weight:620;letter-spacing:-.015em;line-height:1.4;flex:1}
.dhead .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.iconbtn{background:none;border:1px solid transparent;color:var(--text-3);cursor:pointer;border-radius:6px;
  width:26px;height:26px;display:grid;place-items:center;font-size:16px;line-height:1;transition:.12s}
.iconbtn:hover{background:var(--panel-3);color:var(--text)}
.dtabs{display:flex;gap:2px;margin-top:12px;overflow-x:auto}
.dtab{background:none;border:none;color:var(--text-2);padding:8px 12px;cursor:pointer;font-size:12.5px;
  border-bottom:2px solid transparent;transition:.12s;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dtab:hover{color:var(--text)}
.dtab.active{color:var(--text);border-bottom-color:var(--accent);font-weight:550}
.dtab .n{font-family:var(--mono);font-size:10px;background:var(--panel-3);border-radius:999px;padding:0 5px;color:var(--text-3)}
.dbody{flex:1;overflow-y:auto;padding:18px 20px 40px}
.sec{margin-bottom:22px}
.sec h3{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);
  margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sec h3 .line{flex:1;height:1px;background:var(--border)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:9px;margin-bottom:16px}
.kv .item{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px}
.kv .k{font-size:10.5px;color:var(--text-3);margin-bottom:3px;letter-spacing:.03em}
.kv .v{font-size:12.5px;display:flex;align-items:center;gap:6px}
.prose{font-size:13px;line-height:1.72;color:var(--text-2)}
.prose strong{color:var(--text);font-weight:600}
.prose .desc-img{display:block;max-width:100%;max-height:260px;margin:8px 0;border:1px solid var(--border);border-radius:8px;cursor:zoom-out}
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.att{margin:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel);position:relative}
.att img{display:block;width:100%;height:96px;object-fit:cover;cursor:zoom-out;background:var(--panel-2)}
.att-del{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;font-size:12px;line-height:16px;padding:0;cursor:pointer;opacity:0;transition:opacity .12s;z-index:2}
.att:hover .att-del{opacity:1}
.att-del:hover{background:var(--danger,#d9534f)}
.att figcaption{display:flex;align-items:center;gap:5px;padding:5px 7px;font-size:10.5px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .kind{margin-left:auto;flex:none;font-size:9px;padding:1px 5px;border:1px solid var(--border);border-radius:6px;text-transform:uppercase}
.tag.uipend{color:var(--review);border-color:rgba(229,178,60,.4)}
.badge.uipend{color:var(--review);border-color:rgba(229,178,60,.4)}
.badge.uiready{color:var(--done);border-color:rgba(63,193,169,.4)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:999;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:92vw;max-height:92vh;border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.5)}
.acc-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.acc-list li{display:flex;gap:9px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:7px 10px;font-size:12.5px;line-height:1.5}
.acc-list li .ck{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border-2);flex:0 0 14px;
  margin-top:2px;display:grid;place-items:center;font-size:9px;cursor:pointer}
.acc-list li.done .ck{background:var(--done);border-color:var(--done);color:#04150c}
.acc-list li.done span{color:var(--text-3);text-decoration:line-through}
.filerow{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--panel);margin-bottom:5px;font-family:var(--mono);font-size:11.5px}
.filerow .path{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filerow .shared{font-size:10px;color:var(--review);background:rgba(229,178,60,.1);
  border:1px solid rgba(229,178,60,.25);border-radius:5px;padding:0 6px;font-family:var(--sans);cursor:pointer}
.stat{display:flex;gap:5px;font-family:var(--mono);font-size:10.5px}
.stat .add{color:var(--done)}
.stat .del{color:var(--block)}

/* status flow */
.flow{display:flex;align-items:center;gap:0;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--r);padding:9px 12px;flex-wrap:wrap}
.fstep{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
.fstep .bub{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border-2);display:grid;
  place-items:center;font-size:10px;background:var(--surface)}
.fstep.done .bub{background:var(--done);border-color:var(--done);color:#04150c}
.fstep.done{color:var(--text-2)}
.fstep.cur .bub{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fstep.cur{color:var(--text);font-weight:600}
.farrow{width:26px;height:1px;background:var(--border-2);margin:0 7px;position:relative}
.farrow.lock::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:7px;height:7px;border-radius:50%;border:1.5px solid var(--review);background:var(--panel);
  box-shadow:0 0 0 2px var(--panel)}

/* impact */
.impact-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.isum{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.isum .n{font-size:21px;font-weight:640;letter-spacing:-.02em;font-family:var(--mono);line-height:1.2}
.isum .l{font-size:10.5px;color:var(--text-3);margin-top:1px}
.isum.warn .n{color:var(--review)}
.isum.danger .n{color:var(--block)}
.irow{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--panel);margin-bottom:6px;cursor:pointer;transition:.12s}
.irow:hover{border-color:var(--border-2);transform:translateX(2px)}
.risk{font-size:10px;font-weight:600;border-radius:5px;padding:1px 7px;letter-spacing:.02em;flex:0 0 auto}
.risk.high{color:var(--block);background:rgba(242,85,90,.12);border:1px solid rgba(242,85,90,.28)}
.risk.mid,.risk.medium{color:var(--review);background:rgba(229,178,60,.12);border:1px solid rgba(229,178,60,.28)}
.risk.low{color:var(--text-3);background:var(--panel-3);border:1px solid var(--border)}
.irow .why{font-size:10.5px;color:var(--text-3);margin-left:auto;font-family:var(--mono);white-space:nowrap}
.hop{font-family:var(--mono);font-size:10px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.path-viz{font-family:var(--mono);font-size:11px;color:var(--text-2);background:var(--panel-2);
  border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;margin-bottom:10px;overflow-x:auto;white-space:nowrap}
.path-viz b{color:var(--accent)}
.path-viz .arrow{color:var(--text-3);margin:0 5px}

/* review gate */
.gate-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:11px}
.gate-hd{display:flex;align-items:center;gap:9px;padding:10px 13px;border-bottom:1px solid var(--border);background:var(--panel-2)}
.gate-hd .num{width:19px;height:19px;border-radius:50%;background:var(--panel-3);display:grid;place-items:center;
  font-size:10.5px;font-family:var(--mono);color:var(--text-2);border:1px solid var(--border)}
.gate-hd .t{font-size:12.5px;font-weight:580}
.gate-hd .st{margin-left:auto;font-size:11px}
.gate-bd{padding:11px 13px}
.check{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12px}
.check:last-child{border-bottom:none}
.check .ic{width:16px;text-align:center}
.check .nm{font-family:var(--mono);font-size:11.5px}
.check .out{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.pass{color:var(--done)}.fail{color:var(--block)}.pend{color:var(--text-3)}.warnc{color:var(--review)}
.ai-finding{border-left:2px solid var(--border-2);padding:8px 0 8px 11px;margin-bottom:9px}
.ai-finding.sev-high{border-left-color:var(--block)}
.ai-finding.sev-mid{border-left-color:var(--review)}
.ai-finding.sev-low{border-left-color:var(--text-3)}
.af-head{display:flex;align-items:center;gap:7px;margin-bottom:3px;flex-wrap:wrap}
.af-cat{font-size:10.5px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:0 6px}
.af-t{font-size:12.5px;font-weight:550}
.af-b{font-size:12px;color:var(--text-2);line-height:1.6}
.af-b code{font-family:var(--mono);font-size:11px;background:var(--panel-3);padding:1px 4px;border-radius:4px;color:var(--text)}
.cr-card .sec{margin-top:9px;padding-top:9px;border-top:1px dashed var(--border)}
.cr-card .sec h4{font-size:12px;font-weight:600;color:var(--text);margin:0 0 6px;display:flex;align-items:center;gap:7px}
.sec-bar{width:4px;height:14px;border-radius:2px;display:inline-block;flex:0 0 auto}
.snip{margin-bottom:9px}
.snip-h{display:flex;align-items:center;gap:8px;justify-content:space-between;font-size:12px;color:var(--accent);margin-bottom:4px}
.snip-copy{font-size:10.5px;padding:2px 9px;color:var(--text-3)}
.snip-code{font-family:var(--mono);font-size:11.5px;line-height:1.65;background:var(--code-bg);border:1px solid var(--code-border);border-radius:8px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;color:var(--code-fg);margin:0 0 4px;overflow-x:auto}
.tk-k{color:var(--code-k);font-weight:500}
.tk-s{color:var(--code-s)}
.tk-c{color:var(--code-c);font-style:italic}
.tk-n{color:var(--code-n)}
/* 代码主题：跟随界面（深/浅） */
:root,html[data-theme="dark"]{--code-bg:#0b0d10;--code-fg:#e6edf3;--code-border:var(--border);--code-k:#7dd3fc;--code-s:#a5d6a7;--code-c:#8b949e;--code-n:#f0c674}
html[data-theme="light"]{--code-bg:#f6f8fa;--code-fg:#24292f;--code-border:#d0d7de;--code-k:#1d4ed8;--code-s:#15803d;--code-c:#94a3b8;--code-n:#b45309}
/* 代码主题：Xcode 深色（苹果 Default Dark 风格） */
html[data-code-theme="xcode-dark"]{--code-bg:#1f1f24;--code-fg:#f5f5f7;--code-border:#3a3a41;--code-k:#ff7ab2;--code-s:#ff8170;--code-c:#6c7986;--code-n:#d7ba7d}
/* 代码主题：Xcode 浅色（苹果 Default Light 风格） */
html[data-code-theme="xcode-light"]{--code-bg:#ffffff;--code-fg:#1f1f24;--code-border:#d8d8dc;--code-k:#9b30ff;--code-s:#c41a16;--code-c:#1f6f2f;--code-n:#1c00cf}

.snip-note{font-size:11.5px;color:var(--text-3);line-height:1.6}
.verdict-bar{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:var(--r);
  border:1px solid var(--border);background:var(--panel);margin-top:4px;flex-wrap:wrap}
.verdict-bar.pending{border-color:rgba(229,178,60,.32);background:rgba(229,178,60,.06)}
.verdict-bar .txt{font-size:12.5px}
.verdict-bar .acts{margin-left:auto;display:flex;gap:7px}

/* timeline / replay */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:5px;bottom:5px;width:1.5px;background:var(--border)}
.tlitem{position:relative;margin-bottom:14px}
.tlitem::before{content:"";position:absolute;left:-19.5px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:2px solid var(--border-2)}
.tlitem.session::before{border-color:var(--prog)}
.tlitem.change::before{border-color:var(--accent)}
.tlitem.review::before{border-color:var(--done)}
.tlitem.status::before{border-color:var(--text-3)}
.tl-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.tl-time{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.tl-role{font-size:10.5px;border-radius:5px;padding:0 7px;border:1px solid var(--border);color:var(--text-2);background:var(--panel-2)}
.tl-role.assistant{color:var(--accent);border-color:rgba(63,193,169,.3);background:var(--accent-soft)}
.tl-role.user{color:var(--done);border-color:rgba(99,191,106,.28);background:rgba(99,191,106,.08)}
.tl-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.tl-sum{font-size:12.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word}
.decision{margin-top:7px;background:rgba(63,193,169,.07);border:1px solid rgba(63,193,169,.22);
  border-radius:var(--r-sm);padding:7px 10px;font-size:12px;line-height:1.6}
.decision .dl{font-size:10px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase;
  font-weight:650;display:block;margin-bottom:2px}
.commit-line{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;margin-bottom:6px;flex-wrap:wrap}
.sha{color:var(--accent);background:var(--accent-soft);border:1px solid rgba(63,193,169,.24);border-radius:5px;padding:0 6px}
.diffbox{background:#0a0b0d;border:1px solid var(--border);border-radius:var(--r-sm);overflow:hidden;margin-top:8px;font-family:var(--mono);font-size:11.5px}
html[data-theme="light"] .diffbox{background:#fafbfc}
.diff-hd{padding:5px 10px;background:var(--panel-2);border-bottom:1px solid var(--border);color:var(--text-3);
  font-size:10.5px;display:flex;gap:8px;align-items:center}
.diff-body{overflow-x:auto;padding:6px 0;max-height:260px;overflow-y:auto}
.dl-line{display:flex;padding:0 10px;line-height:1.65;white-space:pre}
.dl-line .ln{width:34px;color:var(--text-3);flex:0 0 34px;text-align:right;padding-right:12px;user-select:none;font-size:10.5px}
.dl-line.add{background:rgba(99,191,106,.09);color:#a8e2a4}
.dl-line.del{background:rgba(242,85,90,.09);color:#f79ba0}
.dl-line.hunk{color:var(--accent);background:var(--accent-soft)}
html[data-theme="light"] .dl-line.add{color:#0d6b3f}
html[data-theme="light"] .dl-line.del{color:#a02328}

/* replay scrubber */
.scrub{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;margin-bottom:16px}
.scrub-top{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap}
.scrub-top .t{font-size:12.5px;font-weight:550}
.scrub-top .stamp{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.track{position:relative;height:26px}
.track .rail{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--panel-3);border-radius:2px}
.track .fill{position:absolute;left:0;top:12px;height:2px;background:var(--accent);border-radius:2px}
.tick{position:absolute;top:6px;width:13px;height:13px;border-radius:50%;transform:translateX(-50%);
  background:var(--surface);border:2px solid var(--border-2);cursor:pointer;transition:.12s}
.tick:hover{transform:translateX(-50%) scale(1.25)}
.tick.on{border-color:var(--accent);background:var(--accent)}
.tick.session{border-color:var(--prog)}.tick.change{border-color:var(--accent)}.tick.review{border-color:var(--done)}
.tick.on.session{background:var(--prog)}.tick.on.change{background:var(--accent)}.tick.on.review{background:var(--done)}

/* comments */
.cmt{display:flex;gap:9px;margin-bottom:11px}
.avatar{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:grid;place-items:center;
  font-size:10.5px;font-weight:600;color:#fff}
.cmt-b{flex:1;min-width:0}
.cmt-h{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.cmt-h .a{font-size:12px;font-weight:600}
.cmt-h .t{font-size:10.5px;color:var(--text-3);font-family:var(--mono)}
.cmt-x{font-size:12.5px;color:var(--text-2);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.cmt-x .at{color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 3px}
.composer{display:flex;gap:8px;align-items:flex-start;margin-top:12px}
.composer textarea{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:8px 11px;resize:vertical;min-height:60px;font-size:12.5px;outline:none;line-height:1.6}
.composer textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.composer input[type=text]{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:8px 11px;font-size:12.5px;outline:none;line-height:1.6}
.composer input[type=text]:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}

/* ============================================================
   Modals / decompose / requirements / toast / cmdk
   ============================================================ */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px}
.modal.hidden{display:none}
.mbox{position:relative;width:min(720px,94vw);max-height:86vh;background:var(--surface);
  border:1px solid var(--border-2);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;animation:pop .18s cubic-bezier(.2,.9,.3,1)}
.mbox.wide{width:min(940px,95vw)}
@keyframes pop{from{transform:scale(.97) translateY(6px);opacity:0}to{transform:none;opacity:1}}
.mhead{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.mhead h3{font-size:14px;font-weight:620}
.mhead .sub{font-size:11.5px;color:var(--text-3)}
.mbody{padding:16px 18px;overflow-y:auto;flex:1}
.mfoot{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--panel)}
.mfoot .sp{flex:1}
/* 紧凑确认弹窗（删除附件等） */
.mbox.confirm{width:min(380px,92vw)}
.mbox.confirm .mhead,.mbox.confirm .mbody,.mbox.confirm .mfoot{display:none}
.mbox.confirm .cwrap{display:flex;flex-direction:column}
.cwrap .cbody{padding:24px 24px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:11px}
.cicon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:21px;
  background:rgba(242,85,90,.12);color:var(--block);border:1px solid rgba(242,85,90,.28)}
.cwrap h3{margin:0;font-size:15px;font-weight:620;color:var(--text)}
.cmsg{font-size:12.5px;line-height:1.7;color:var(--text-2);white-space:pre-wrap}
.cchip{font-family:var(--mono);font-size:11px;color:var(--text);background:var(--panel);border:1px solid var(--border);
  border-radius:6px;padding:3px 9px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cwrap .cfoot{display:flex;gap:9px;width:100%;padding:8px 24px 22px}
.cwrap .cfoot .btn{flex:1;justify-content:center;padding:8px 12px;font-size:12.5px;border-radius:8px}
.btn.danger-solid{background:linear-gradient(180deg,#e5565b,#c93a40);border-color:#b03136;color:#fff;font-weight:550;
  box-shadow:0 2px 10px -2px rgba(229,86,91,.5)}
.btn.danger-solid:hover{background:linear-gradient(180deg,#ef656a,#d6474d);border-color:#b03136;color:#fff}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;color:var(--text-2);margin-bottom:5px;font-weight:550}
.field input,.field select,.field textarea{
  width:100%;background:var(--panel);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:7px 10px;outline:none;font-size:12.5px;transition:.13s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{resize:vertical;min-height:88px;line-height:1.6;font-family:var(--mono);font-size:11.5px}
.hint{font-size:10.5px;color:var(--text-3);margin-top:4px}

.term{background:#08090b;border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;
  font-family:var(--mono);font-size:11.5px;line-height:1.75;max-height:210px;overflow-y:auto}
html[data-theme="light"] .term{background:#f7f8fa}
.term .ok{color:var(--done)}.term .dim{color:var(--text-3)}.term .hl{color:var(--accent)}.term .yl{color:var(--review)}
.cursor{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.propose{border:1px solid var(--border);border-radius:var(--r);background:var(--panel);margin-bottom:7px;overflow:hidden}
.pp-head{display:flex;align-items:center;gap:9px;padding:9px 12px;flex-wrap:wrap}
.pp-head .ck{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--border-2);display:grid;
  place-items:center;font-size:9px;cursor:pointer;flex:0 0 15px}
.pp-head .ck.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pp-title{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-body{padding:0 12px 10px 36px;font-size:11.5px;color:var(--text-3);display:flex;flex-direction:column;gap:5px}
.pp-body .row{display:flex;gap:7px;align-items:flex-start}
.pp-body .lbl{color:var(--text-3);min-width:52px;font-size:10.5px}

#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--panel-2);border:1px solid var(--border-2);border-radius:var(--r);padding:9px 13px;
  font-size:12.5px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px;min-width:230px;
  animation:tin .22s cubic-bezier(.2,.9,.3,1);max-width:420px;word-break:break-word}
@keyframes tin{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.toast.out{animation:tout .2s forwards}
@keyframes tout{to{transform:translateX(20px);opacity:0}}
.toast.ok{border-left:2.5px solid var(--done)}
.toast.err{border-left:2.5px solid var(--block)}
.toast.info{border-left:2.5px solid var(--accent)}
.toast.warn{border-left:2.5px solid var(--review)}

.cmdk{position:fixed;inset:0;z-index:120;display:flex;justify-content:center;padding-top:14vh;background:rgba(0,0,0,.55);backdrop-filter:blur(3px)}
.cmdk.hidden{display:none}
.cmdbox{width:min(560px,92vw);height:max-content;max-height:60vh;background:var(--panel);border:1px solid var(--border-2);
  border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden;display:flex;flex-direction:column;animation:pop .16s}
.cmdbox input{width:100%;background:none;border:none;outline:none;padding:14px 16px;font-size:14px;border-bottom:1px solid var(--border)}
.cmdlist{overflow-y:auto;padding:6px}
.cmditem{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px}
.cmditem.sel,.cmditem:hover{background:var(--accent-soft)}
.cmditem .ic{width:16px;text-align:center}
.cmditem .k{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-3)}

.emptystate{display:grid;place-items:center;height:100%;text-align:center;padding:40px}
.emptystate .big{font-size:34px;margin-bottom:10px;opacity:.6}
.ic-svg{vertical-align:-2px;flex:none}
button .ic-svg,.btn .ic-svg{margin-right:5px;vertical-align:-2px}
.emptystate .t{font-size:14px;font-weight:600;margin-bottom:5px}
.emptystate .d{font-size:12.5px;color:var(--text-3);max-width:400px;line-height:1.7;margin-bottom:14px}

/* ---------- 计划栏 / 校验 / 提醒 ---------- */
.planbar{display:flex;align-items:center;gap:12px;padding:7px 18px;border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,var(--accent-soft),transparent 55%),var(--surface);min-height:40px;overflow:hidden}
.planbar .pb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);flex:0 0 auto;white-space:nowrap}
.planbar .pb-scroll{display:flex;align-items:center;gap:12px;overflow-x:auto;flex:1 1 auto;min-width:0;
  scrollbar-width:none;-ms-overflow-style:none}
.planbar .pb-scroll::-webkit-scrollbar{display:none}
.planbar .pb .lb{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.planbar .pb-sep{width:1px;height:16px;background:var(--border)}
.pb-chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;flex:0 0 auto;border:1px solid var(--border);background:var(--panel);
  border-radius:999px;padding:2px 9px;font-size:11.5px;cursor:pointer;transition:.12s;color:var(--text-2);max-width:230px}
.pb-chip:hover{border-color:var(--accent-2);color:var(--text)}
.pb-chip .tid{font-size:10.5px}
.pb-chip .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb-prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-3);flex:0 0 auto;padding-left:8px}
.pb-bar{width:100px;height:4px;border-radius:3px;background:var(--panel-3);overflow:hidden;display:flex}
.pb-bar i{display:block;height:100%}
.vstatus{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;border:1px solid var(--border);
  background:var(--panel);border-radius:999px;padding:2px 10px;cursor:pointer}
.vstatus.ok{color:var(--done);border-color:rgba(99,191,106,.32)}
.vstatus.err{color:var(--block);border-color:rgba(242,85,90,.32)}
.vstatus .v-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.bellwrap{position:relative}
.bell-badge{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;border-radius:8px;background:var(--block);
  color:#fff;font-size:9.5px;font-family:var(--mono);display:grid;place-items:center;padding:0 4px;border:1.5px solid var(--bg)}
.notice-item{display:flex;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;
  background:var(--panel-2);margin-bottom:7px;cursor:pointer;transition:.12s}
.notice-item:hover{border-color:var(--accent-2)}
.notice-item.unread{border-left:2.5px solid var(--review);background:rgba(229,178,60,.06)}
.notice-item .nt{font-size:10.5px;color:var(--text-3);font-family:var(--mono);flex:0 0 76px}
.notice-item .nb{flex:1;font-size:12px;line-height:1.55}
.acc-edit{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.acc-edit input{flex:1;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:4.5px 9px;font-size:12.5px;outline:none}
.acc-edit input:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px var(--accent-soft)}
.acc-edit .rm{background:none;border:none;color:var(--text-3);cursor:pointer;font-size:14px;padding:0 4px;border-radius:4px}
.acc-edit .rm:hover{color:var(--block);background:rgba(242,85,90,.1)}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:5px;max-height:190px;overflow:auto;
  border:1px solid var(--border);border-radius:8px;padding:8px;background:var(--panel-2)}
.chkgrid label{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-2);cursor:pointer;
  padding:3px 5px;border-radius:5px}
.chkgrid label:hover{background:var(--panel-3);color:var(--text)}
.chkgrid input{accent-color:var(--accent);width:13px;height:13px;flex:0 0 auto}
.chkgrid .tid{white-space:nowrap;flex:0 0 auto}
.chkgrid label.dis{opacity:.4;cursor:not-allowed}
.vrow{display:flex;gap:9px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--panel-2);
  border:1px solid var(--border);margin-bottom:6px;font-size:12px}
.vrow .lv{font-size:10px;padding:1px 6px;border-radius:4px;flex:0 0 auto;letter-spacing:.03em}
.vrow.err .lv{background:rgba(242,85,90,.14);color:var(--block)}
.vrow.warn .lv{background:rgba(229,178,60,.14);color:var(--review)}
.rt-row{display:flex;align-items:center;gap:9px;padding:8px 11px;border:1px solid var(--border);
  border-radius:var(--r-sm);background:var(--panel);margin-bottom:6px;cursor:pointer;transition:.12s}
.rt-row:hover{border-color:var(--border-2);transform:translateX(2px)}
.loading,.error{padding:40px;text-align:center;color:var(--text-3);font-size:12.5px}
.error{color:var(--block)}
@media(max-width:1080px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .trow{grid-template-columns:64px 1fr 92px 110px;}
  .trow>*:nth-child(n+5){display:none}
}
</style>
</head>
<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">
        <img class="logo-icon" src="logo-icon.svg" alt="" />
        <img class="logo-mark" src="logo-mark.svg" alt="" />
      </div>
      <div class="brand-txt">
        <span class="brand-name">Vibe Task Panel</span>
        <span class="brand-sub mono" id="repo-line">依赖驱动的AI任务看板</span>
      </div>
    </div>

    <div class="sb-scroll">
      <div class="sb-label">视图</div>
      <div class="nav-item active" data-scope="all"><span class="ico">◎</span>全部任务<span class="n" id="n-all">0</span></div>
      <div class="nav-item" data-scope="mine"><span class="ico">◐</span>进行中<span class="n" id="n-prog">0</span></div>
      <div class="nav-item" data-scope="review"><span class="ico">◍</span>待我审查<span class="n warn" id="n-review">0</span></div>
      <div class="nav-item" data-scope="blocked"><span class="ico">◭</span>阻塞<span class="n" id="n-blocked">0</span></div>

      <div class="sb-label">需求 <button title="新建需求" onclick="openReqModal()">＋</button></div>
      <div id="req-list"></div>

      <div class="sb-label">工具</div>
      <div class="nav-item" onclick="openDecompose()"><span class="ico">⚡</span>拆解需求<span class="n mono">/decompose</span></div>
      <div class="nav-item" onclick="openImpactStudio()"><span class="ico">◈</span>影响分析台</div>
      <div class="nav-item" onclick="openReviewQueue()"><span class="ico">✓</span>Review 队列</div>
      <div class="nav-item" onclick="openReplayHub()"><span class="ico">◷</span>回看 · 记忆库</div>
      <div class="nav-item" onclick="openCodeReviewHub()"><span class="ico">✦</span>代码回顾</div>
      <div class="nav-item" onclick="manageProviders()"><span class="ico">⚙</span>AI Provider</div>
    </div>

    <div class="sb-foot">
      <div class="test-menu" id="test-menu">
        <div class="test-menu-head" onclick="toggleTestMenu()" title="收起/展开">
          <span>测试</span><span class="caret" id="test-caret">▸</span>
        </div>
        <div class="test-menu-body hidden" id="test-menu-body">
          <div class="nav-item" onclick="showValidate()"><span class="ico">◑</span>运行检查<span class="n mono">/validate</span></div>
        </div>
      </div>
      <div class="cmd-hint" onclick="syncNow()" style="cursor:pointer" title="重新读取 tasks/*.json"><span>最近同步</span><span class="mono" style="font-size:10.5px" id="sync-ago">刚刚</span></div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <div class="crumb">
        <h1 id="view-title">全部任务</h1>
        <span class="sep">/</span>
        <span class="sub" id="view-sub"></span>
      </div>
      <nav class="seg" style="margin-left:14px">
        <button data-view="kanban" class="active">看板</button>
        <button data-view="list">列表</button>
        <button data-view="graph">依赖图</button>
      </nav>
      <div class="tb-right">
        <div class="search">
          <span style="color:var(--text-3);font-size:12px">⌕</span>
          <input id="q" placeholder="搜索 ID / 标题 / 文件 / 改动…" />
          <kbd>/</kbd>
        </div>
        <div class="bellwrap"><button class="btn icon" id="bell-btn" title="下游提醒" onclick="showNotices()"><svg class="ic-svg" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.6a4 4 0 0 1 8 0c0 3 .9 4.2 1.4 4.7H2.6C3.1 10.8 4 9.6 4 6.6Z"/><path d="M6.6 13.4a1.6 1.6 0 0 0 2.8 0"/></svg></button>
          <span class="bell-badge hidden" id="bell-badge">0</span></div>
        <button class="btn" onclick="openNewTask()">＋ 新建任务</button>
        <button class="btn primary" onclick="openDecompose()">⚡ 拆解需求</button>
        <button class="btn icon" id="theme-btn" title="切换主题">☾</button>
      </div>
    </header>

    <div class="planbar" id="planbar"></div>
    <div class="filterbar" id="filterbar"></div>

    <div class="content" id="content"></div>
  </div>
</div>

<div id="lightbox" class="hidden" onclick="closeLightbox()"><img id="lightbox-img" src="" alt="预览"/></div>

<!-- ============ DRAWER ============ -->
<div class="drawer hidden" id="drawer">
  <div class="backdrop" onclick="closeDrawer()"></div>
  <div class="dpanel">
    <div class="dhead">
      <div class="dhead-top">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
            <span class="tid" id="d-id">T-000</span>
            <span class="badge" id="d-req"></span>
          </div>
          <h2 id="d-title">任务标题</h2>
        </div>
        <button class="iconbtn" title="上一个" onclick="siblingTask(-1)">↑</button>
        <button class="iconbtn" title="下一个" onclick="siblingTask(1)">↓</button>
        <button class="iconbtn" title="关闭 (Esc)" onclick="closeDrawer()">×</button>
      </div>
      <div class="meta" id="d-meta"></div>
      <div class="dtabs" id="d-tabs"></div>
    </div>
    <div class="dbody" id="d-body"></div>
  </div>
</div>

<!-- ============ MODAL ============ -->
<div class="modal hidden" id="modal">
  <div class="backdrop" onclick="closeModal()"></div>
  <div class="mbox" id="mbox"></div>
</div>

<!-- ============ CMD-K ============ -->
<div class="cmdk hidden" id="cmdk">
  <div class="backdrop" onclick="toggleCmdk(false)"></div>
  <div class="cmdbox">
    <input id="cmdk-input" placeholder="输入命令或搜索任务…" />
    <div class="cmdlist" id="cmdk-list"></div>
  </div>
</div>

<div id="toasts"></div>
<script>
'use strict';
/* ============================================================
   1. 领域常量
   ============================================================ */
const STATUS = {
  todo:        { label:'待办',   color:'var(--todo)',   raw:'#7c828d', ico:'○' },
  in_progress: { label:'进行中', color:'var(--prog)',   raw:'#4ea1ff', ico:'◐' },
  in_review:   { label:'待审查', color:'var(--review)', raw:'#e5b23c', ico:'◍' },
  done:        { label:'已完成', color:'var(--done)',   raw:'#63bf6a', ico:'●' },
  blocked:     { label:'阻塞',   color:'var(--block)',  raw:'#f2555a', ico:'◭' }
};
const ORDER = ['todo','in_progress','in_review','done','blocked'];
const TRANSITIONS = {
  todo:['in_progress','blocked'],
  in_progress:['in_review','blocked','todo'],
  in_review:['done','in_progress','blocked'],
  done:[],
  blocked:['todo','in_progress']
};
const REQ_PALETTE = ['#3fc1a9','#6ba3e8','#e5b23c','#c98be0','#f2555a','#63bf6a','#4ea1ff'];
const AVATAR_PALETTE = ['#1f9b86','#63bf6a','#e5b23c','#f2555a','#6ba3e8','#c98be0'];

/* ============================================================
   2. 运行时状态
   ============================================================ */
const S = {
  view:'kanban', scope:'all', req:'', q:'', status:'', dep:'', file:'',
  current:null, tab:'overview', replayIdx:null, graphSel:null,
  pan:{x:0,y:0}, zoom:1,
  tasks:[], requirements:[], branch:'', validate:null, deps:null,
  syncAt:Date.now()
};
const taskCache = {};      /* id -> 详情（抽屉打开时更新） */
const lastChecks = {};     /* id -> run_checks 原始返回 */

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial = n => (n && n[0]) ? n[0].toUpperCase() : '?';
const byId = id => taskCache[id] || S.tasks.find(t => t.id === id) || null;
const reqColor = name => { let h = 0; for (const c of String(name||'')) h = (h*31 + c.charCodeAt(0)) >>> 0; return REQ_PALETTE[h % REQ_PALETTE.length]; };
const avColor = name => { let h = 0; for (const c of String(name||'')) h = (h*31 + c.charCodeAt(0)) >>> 0; return AVATAR_PALETTE[h % AVATAR_PALETTE.length]; };
function fmt(ts){ if(!ts) return ''; const d=new Date(ts); if(isNaN(d)) return String(ts); const p=n=>String(n).padStart(2,'0');
  return d.getMonth()+1+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }

/* 内联 SVG 图标 */
const ICONS = {
  bell:'<path d="M4 6.6a4 4 0 0 1 8 0c0 3 .9 4.2 1.4 4.7H2.6C3.1 10.8 4 9.6 4 6.6Z"/><path d="M6.6 13.4a1.6 1.6 0 0 0 2.8 0"/>',
  lock:'<path d="M5 7V5a3 3 0 0 1 6 0v2"/><rect x="3" y="7" width="10" height="6.5" rx="1.6"/>',
  bot:'<rect x="3" y="5.5" width="10" height="8" rx="2.2"/><path d="M8 2.2v3.3"/><circle cx="6" cy="9.4" r=".9" fill="currentColor" stroke="none"/><circle cx="10" cy="9.4" r=".9" fill="currentColor" stroke="none"/>',
  clock:'<circle cx="8" cy="8" r="6"/><path d="M8 4.6V8l2.4 1.5"/>',
  pencil:'<path d="M11.2 2.6l2.2 2.2L5.6 12.6 2.6 13.4l.8-3z"/>',
  chat:'<path d="M13.5 9.2a2 2 0 0 1-2 2H6.2L3 13.6V4.4a2 2 0 0 1 2-2h6.5a2 2 0 0 1 2 2z"/>',
  sync:'<path d="M13.2 7.1A5.2 5.2 0 0 0 3.6 5.4"/><path d="M2.8 8.9a5.2 5.2 0 0 0 9.6 1.7"/><path d="M3.4 2.6v2.9h2.9"/><path d="M12.6 13.4v-2.9H9.7"/>',
  check:'<circle cx="8" cy="8" r="6"/><path d="M5.4 8.2l1.9 1.9 3.4-3.9"/>',
  ban:'<circle cx="8" cy="8" r="6"/><path d="M4.2 4.2l7.6 7.6"/>',
  hourglass:'<path d="M4.5 2.4h7M4.5 13.6h7"/><path d="M5.2 2.4c0 3 3 3.4 3 5.6 0 2.2-3 2.6-3 5.6"/><path d="M10.8 2.4c0 3-3 3.4-3 5.6 0 2.2 3 2.6 3 5.6"/>',
  clip:'<rect x="4" y="2.6" width="8" height="11" rx="1.6"/><path d="M6.2 2.6V4h3.6V2.6"/><path d="M6.3 7.6h3.4M6.3 10.2h3.4"/>',
  board:'<rect x="2.4" y="3" width="11.2" height="10" rx="1.6"/><path d="M6.1 3v10M9.9 3v10"/>',
  list:'<path d="M3 4.4h10M3 8h10M3 11.6h10"/>',
  play:'<path d="M5.4 3.4l6.4 4.6-6.4 4.6z"/>',
  test:'<path d="M6.4 2.4v4L3.2 11.6a1.5 1.5 0 0 0 1.3 2.3h7a1.5 1.5 0 0 0 1.3-2.3L9.6 6.4v-4"/><path d="M5.6 2.4h4.8"/>',
  search:'<circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4L14 14"/>'
};
function ic(name, size, cls){
  const s = size||13;
  return '<svg class="ic-svg '+(cls||'')+'" width="'+s+'" height="'+s+'" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(ICONS[name]||'')+'</svg>';
}
function dot(color){
  return '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:'+color+';vertical-align:middle;margin-right:5px"></span>';
}

function toast(msg,type){
  const el=document.createElement('div');
  el.className='toast '+(type||'info');
  el.innerHTML='<span>'+({ok:'✓',err:'✕',warn:'⚠',info:'›'}[type||'info'])+'</span><span>'+msg+'</span>';
  $('#toasts').appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),200); },2600);
}

/* ---------- API ---------- */
async function api(path, opts){
  opts = opts || {};
  const init = { method: opts.method || 'GET' };
  if (opts.body !== undefined) { init.headers = { 'Content-Type':'application/json' }; init.body = JSON.stringify(opts.body); }
  let res;
  try { res = await fetch(path, init); }
  catch (e) { throw new Error('网络错误：'+e.message); }
  let data = null;
  const ct = res.headers.get('content-type') || '';
  if (ct.indexOf('application/json') !== -1) { try { data = await res.json(); } catch(e){} }
  else { try { data = await res.text(); } catch(e){} }
  if (!res.ok) throw new Error((data && data.error) || ('请求失败 ('+res.status+')'));
  if (data && typeof data === 'object' && data.error) throw new Error(data.error);
  return data;
}

/* ============================================================
   3. 依赖 / 影响分析引擎（客户端，用于卡片计数与依赖图高亮）
   ============================================================ */
function downstream(id){
  const out=[]; const seen=new Set([id]); const q=[[id,0]];
  while(q.length){
    const [cur,hop]=q.shift();
    S.tasks.filter(t=>(t.depends_on||[]).includes(cur)).forEach(t=>{
      if(seen.has(t.id)) return;
      seen.add(t.id); out.push({id:t.id,hop:hop+1,via:cur,reason:'显式依赖'});
      q.push([t.id,hop+1]);
    });
  }
  return out;
}
function sharedFileTasks(id){
  const me=byId(id); if(!me) return [];
  const res=[];
  S.tasks.forEach(t=>{
    if(t.id===id) return;
    const shared=(t.files||[]).filter(f=>(me.files||[]).includes(f));
    if(shared.length) res.push({id:t.id,hop:null,via:shared.join(', '),reason:'共享文件'});
  });
  return res;
}
function impact(id){
  const dn=downstream(id), sf=sharedFileTasks(id);
  const map=new Map();
  dn.forEach(x=>map.set(x.id,x));
  sf.forEach(x=>{
    if(map.has(x.id)){ const e=map.get(x.id); e.reason='依赖 + 共享文件'; e.via=e.via+' / '+x.via; }
    else map.set(x.id,x);
  });
  const items=Array.from(map.values()).map(x=>{
    const t=byId(x.id);
    if(!t) return null;
    let score = (x.reason.includes('共享文件')?2:0) + (x.hop===1?2:x.hop===2?1:0);
    if(t.status==='done') score+=2;
    if(t.status==='in_review') score+=1;
    const risk = score>=4?'high':score>=2?'mid':'low';
    return Object.assign({}, x, { task:t, risk:risk, score:score });
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
  const files=new Set();
  items.forEach(i=>(i.task.files||[]).forEach(f=>{ if((byId(id)&&byId(id).files||[]).includes(f)) files.add(f); }));
  return { items:items, files:Array.from(files), tests: items.filter(i=>i.risk!=='low').map(i=>i.task) };
}
function impactCount(id){ return impact(id).items.length; }
function depPath(from,to){
  const prev={}; const q=[from]; const seen=new Set([from]);
  while(q.length){ const c=q.shift();
    for(const t of S.tasks.filter(x=>(x.depends_on||[]).includes(c))){
      if(seen.has(t.id)) continue; seen.add(t.id); prev[t.id]=c;
      if(t.id===to){ const p=[to]; let k=to; while(prev[k]){ k=prev[k]; p.unshift(k);} return p; }
      q.push(t.id);
    }
  }
  return null;
}
function gateReady(t){
  if(!t || !t.review) return 'none';
  const c=t.review.check_results||{};
  const vals=Object.values(c);
  if(!vals.length) return 'none';
  if(vals.some(v=>String(v).startsWith('fail'))) return 'fail';
  if(vals.some(v=>v==='pending')) return 'pending';
  return 'pass';
}

/* ============================================================

function visible(){
  let ts = S.tasks.slice();
  if(S.scope==='mine')    ts=ts.filter(t=>t.status==='in_progress');
  if(S.scope==='review')  ts=ts.filter(t=>t.status==='in_review');
  if(S.scope==='blocked') ts=ts.filter(t=>t.status==='blocked');
  if(S.req)    ts=ts.filter(t=>(t.requirement||'未分类')===S.req);
  if(S.status) ts=ts.filter(t=>t.status===S.status);
  if(S.dep==='has')  ts=ts.filter(t=>(t.depends_on||[]).length>0);
  if(S.dep==='none') ts=ts.filter(t=>(t.depends_on||[]).length===0);
  if(S.file){
    const f=S.file.toLowerCase();
    ts=ts.filter(t=>(t.files||[]).some(x=>String(x).toLowerCase().includes(f)));
  }
  if(S.q){
    const q=S.q.toLowerCase();
    ts=ts.filter(t=>[t.id,t.title,t.description,t.requirement,(t.files||[]).join(' '),
      (t.acceptance||[]).join(' '),(t.changes||[]).map(c=>c.diff_summary+' '+c.commit+' '+(c.file_paths||[]).join(' ')).join(' '),
      (t.sessions||[]).map(s=>s.summary+' '+(s.decision||'')).join(' ')].join(' ').toLowerCase().includes(q));
  }
  return ts;
}

function renderValidateChip(){
  const v=S.validate;

  if(v.valid) return '<span class="vstatus ok" onclick="showValidate()" title="点击查看详情"><span class="v-dot"></span>DAG 校验通过</span>';
  const errs=(v.errors||[]);
  const hard=errs.filter(e=>e && e.lv==='错误').length;
  const soft=errs.length-hard;
  const txt=hard? hard+' 个错误' : (soft? soft+' 项提醒' : '校验失败');
  return '<span class="vstatus '+(hard?'err':'')+'" onclick="showValidate()" title="'+esc(errs.map(String).join('；'))+'"><span class="v-dot"></span>'+txt+'</span>';

function renderPlanBar(){
  const ts=visible();
  const doing = ts.filter(t=>t.status==='in_progress');
  const ready = t => (t.depends_on||[]).every(d=>{ const dt=byId(d); return !dt || dt.status==='done'; });
  const next  = ts.filter(t=>t.status==='todo' && ready(t));
  const soon = next.length? [] : ts.filter(t=>t.status==='todo').map(t=>{
      const block=(t.depends_on||[]).filter(d=>byId(d)&&byId(d).status!=='done');
      return {t:t, block:block, score: block.length*10 - block.filter(d=>byId(d)&&byId(d).status==='in_review').length*3};
    }).sort((a,b)=>a.score-b.score).slice(0,2);
  const blocked = ts.filter(t=>t.status==='blocked');
  const done = ts.filter(t=>t.status==='done').length;
  const pct = ts.length? Math.round(done/ts.length*100) : 0;
  const bar = ORDER.map(st=>{ const n=ts.filter(t=>t.status===st).length;
    return n?'<i style="width:'+(n/ts.length*100)+'%;background:'+STATUS[st].color+'"></i>':''; }).join('');
  const chip = (t, extra) => '<span class="pb-chip" onclick="openDetail(&#39;'+t.id+'&#39;,&#39;overview&#39;)" title="'+esc(t.title)+'">'+
      '<span class="sw" style="width:6px;height:6px;border-radius:50%;background:'+STATUS[t.status].color+';'+(extra&&extra.dim?'opacity:.5':'')+'"></span>'+
      '<span class="tid">'+t.id+'</span><span class="tt">'+esc((t.title||'').length>10?t.title.slice(0,10)+'…':t.title)+'</span>'+
      (extra&&extra.wait?'<span class="muted" style="font-size:10px">等 '+esc(extra.wait)+'</span>':'')+
    '</span>';
  const chips = (arr,empty) => arr.length
    ? arr.slice(0,2).map(t=>chip(t)).join('') + (arr.length>2?'<span class="muted" style="font-size:11px">+'+(arr.length-2)+'</span>':'')
    : '<span class="muted" style="font-size:11.5px">'+empty+'</span>';

  let html = '<div class="pb-scroll">';
  html += '<div class="pb"><span class="lb">进行中</span>'+chips(doing,'暂无')+'</div>';
  if(blocked.length) html += '<div class="pb-sep"></div><div class="pb"><span class="lb" style="color:var(--block)">阻塞</span>'+chips(blocked,'')+'</div>';
  html += '<div class="pb-sep"></div>';
  html += '<div class="pb"><span class="lb">下一步</span>';
  if(next.length) html += chips(next,'');
  else {
    if(!soon.length) html += '<span class="muted" style="font-size:11.5px">全部完成</span>';
    html += soon.map(function(o){ return chip(o.t,{dim:true,wait:(o.block[0]||'')}); }).join('');
  }
  html += '</div></div>';
  html += '<div class="pb-prog">';
  html += renderValidateChip();
  html += '<div class="pb-bar">'+bar+'</div>';
  html += '<span class="mono">'+done+'/'+ts.length+' · '+pct+'%</span>';
  html += '<button class="btn sm" onclick="openReplayHub()">'+ic('clock',11)+'回看</button>';
  html += '</div>';
  $('#planbar').innerHTML = html;
}

function cardHTML(t){
  const st=STATUS[t.status]||STATUS.todo;

  const imp=impactCount(t.id);
  const gate=gateReady(t);
  let gateRow='';
  if(t.status==='in_review'||t.status==='done'){
    const c=(t.review&&t.review.check_results)||{};
    const pip=v=>'<div class="gate-pip '+((v||'').startsWith('pass')?'pass':(v||'').startsWith('fail')?'fail':v==='pending'?'run':'')+'"></div>';
    gateRow='<div class="gate-row" title="lint / typecheck / test">'+pip(c.lint)+pip(c.typecheck)+pip(c.test)+'</div>';
  }
  let exec='';
  if(t.exec_state && t.status==='in_progress'){
    const m = t.exec_state==='running' ? '<span style="color:var(--prog)">● 正在执行</span>'
      : t.exec_state==='done' ? '<span style="color:var(--done)">✓ 已执行完</span>' : '<span style="color:var(--text-3)">○ 排队中</span>';
    exec='<div class="exec-state '+t.exec_state+'">'+m+'</div>';

  return '<div class="card" data-id="'+t.id+'" draggable="true" style="--c:'+st.color+'">'+
    gateRow+exec+
    '<div class="card-top">'+
      '<span class="tid">'+t.id+'</span>'+
      '<span class="spacer"></span>'+
      (t.review&&t.review.verdict==='rejected'?'<span style="font-size:10.5px;color:var(--block)">已打回</span>':'')+
      (gate==='fail'&&t.status==='in_review'?'<span style="font-size:10.5px;color:var(--block)">检查未过</span>':'')+
    '</div>'+
    '<div class="card-title">'+esc(t.title)+'</div>'+
    (t.blocked_reason?'<div class="blocked-note"><span>⚠</span><span>'+esc(t.blocked_reason)+'</span></div>':'')+
    '<div class="card-tags">'+
      '<span class="tag req" style="color:'+reqColor(t.requirement)+';border-color:'+reqColor(t.requirement)+'33">'+esc(t.requirement||'未分类')+'</span>'+
      ((t.files||[]).length?'<span class="tag">'+(t.files||[]).length+' 文件</span>':'')+

    '</div>'+

}

/* ============================================================
   8. 依赖图 DAG
   ============================================================ */
function renderGraph(){
  const el=$('#content');
  const ts=visible();
  if(!ts.length){ el.innerHTML=emptyHTML(); return; }
  const ids=new Set(ts.map(t=>t.id));
  /* 分层：优先用已加载的 /api/deps layers；否则按 depends_on 前端计算，避免全部落到 L0 一列 */
  let layers = S.deps && S.deps.layers ? S.deps.layers : null;
  if (!layers) {
    layers = {};
    ts.forEach(t => { layers[t.id] = 0; });
    for (let k = 0; k < ts.length; k++) {
      let changed = false;
      ts.forEach(t => (t.depends_on || []).forEach(d => {
        if (ids.has(d) && layers[d] + 1 > (layers[t.id] || 0)) { layers[t.id] = layers[d] + 1; changed = true; }
      }));
      if (!changed) break;
    }
  }

  const byLayer={};
  ts.forEach(t=>{
    const l = (layers && layers[t.id]!=null) ? layers[t.id] : 0;
    (byLayer[l]=byLayer[l]||[]).push(t);
  });
  const layerKeys=Object.keys(byLayer).map(Number).sort((a,b)=>a-b);
  const pos={}; const NW=240,NH=84,GX=320,GY=112;
  layerKeys.forEach(l=>{
    byLayer[l].sort((a,b)=>a.id.localeCompare(b.id)).forEach((t,i)=>{
      pos[t.id]={x:60+l*GX, y:70+i*GY, w:NW, h:NH, layer:l};
    });
  });
  const maxL=layerKeys.length?layerKeys[layerKeys.length-1]:0;
  const maxN=Math.max(1,...layerKeys.map(l=>byLayer[l].length));
  const w=60+(maxL+1)*GX+40, h=70+maxN*GY+40;

  const sel=S.graphSel;
  const impSet=new Set(), pathEdges=new Set();
  if(sel){
    impact(sel).items.forEach(i=>{ if(ids.has(i.id)) impSet.add(i.id); });
    impSet.forEach(id=>{ const p=depPath(sel,id); if(p) for(let i=0;i<p.length-1;i++) pathEdges.add(p[i]+'>'+p[i+1]); });
  }
  const edges=[];
  ts.forEach(t=>(t.depends_on||[]).forEach(d=>{ if(ids.has(d)) edges.push([d,t.id]); }));

  const AH=9, AW=5;
  const edgeSvg=edges.map(([a,b])=>{
    const A=pos[a],B=pos[b];
    if(!A||!B) return '';
    const x1=A.x+A.w, y1=A.y+A.h/2, x2=B.x, y2=B.y+B.h/2;
    const tipX=x2-1.5, baseX=tipX-AH;
    const mx=(x1+baseX)/2;
    const hot=pathEdges.has(a+'>'+b);
    const faded=sel && !hot && !(a===sel||b===sel);
    const cls=(hot?'hot':'')+' '+(faded?'faded':'');
    return '<g class="gedge-g '+(faded?'faded':'')+'">'+
      '<circle class="gedge-src '+cls+'" cx="'+x1+'" cy="'+y1+'" r="2.6"/>'+
      '<path class="gedge '+cls+'" d="M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+baseX+','+y2+'"/>'+
      '<path class="gedge-head '+cls+'" d="M'+baseX+','+(y2-AW)+' L'+tipX+','+y2+' L'+baseX+','+(y2+AW)+' Z"/>'+
    '</g>';
  }).join('');

  const nodeSvg=ts.map(t=>{
    const p=pos[t.id], st=STATUS[t.status]||STATUS.todo;
    const isSel=t.id===sel, isImp=impSet.has(t.id);
    const faded=sel && !isSel && !isImp;
    const title=(t.title||'').length>13? t.title.slice(0,13)+'…' : (t.title||'');
    const imp=impactCount(t.id);
    return '<g class="gnode '+(isSel?'sel':'')+' '+(isImp?'impacted':'')+' '+(faded?'faded':'')+'" data-id="'+t.id+'" transform="translate('+p.x+','+p.y+')">'+
      '<rect class="nbox" width="'+p.w+'" height="'+p.h+'" rx="10"/>'+
      '<rect width="3" height="'+p.h+'" rx="1.5" fill="'+st.raw+'"/>'+
      '<text class="gid" x="16" y="22">'+t.id+'</text>'+
      '<text class="gid" x="'+(p.w-16)+'" y="22" text-anchor="end" fill="'+st.raw+'">'+st.label+'</text>'+
      '<text class="gtitle" x="16" y="48">'+esc(title)+'</text>'+
      '<text class="gmeta" x="16" y="72">⇠'+(t.depends_on||[]).length+'  ⇢'+imp+'  '+(t.files||[]).length+'f</text>'+
      (isImp?'<circle cx="'+(p.w-12)+'" cy="'+(p.h-12)+'" r="4" fill="var(--review)"/>':'')+
    '</g>';
  }).join('');

  const layerLabels=Array.from({length:maxL+1},(_,i)=>
    '<text class="layer-label" x="'+(60+i*GX)+'" y="38">L'+i+(i===0?' · 无前置':'')+'</text>').join('');

  el.innerHTML='<div class="graphwrap">'+
    '<div class="graph-toolbar">'+
      '<button class="btn sm" onclick="zoomBy(0.12)">＋</button>'+
      '<button class="btn sm" onclick="zoomBy(-0.12)">－</button>'+
      '<button class="btn sm" onclick="S.zoom=1;S.pan={x:0,y:0};render()">重置</button>'+
      '<span class="muted" style="font-size:11px;padding:0 6px">点击卡片打开详情 · 滚轮缩放 · 拖拽平移</span>'+
    '</div>'+
    '<div class="graph-legend">'+
      '<div class="lg-row"><span class="lg-line"></span>依赖边 A → B（B 依赖 A）</div>'+
      '<div class="lg-row"><span class="lg-line impact"></span>影响传播链路</div>'+
      '<div class="lg-row"><span style="width:22px;text-align:center">◌</span>虚线框 = 受选中任务影响</div>'+
    '</div>'+
    '<svg class="graph-svg" id="gsvg" width="100%" height="100%" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMinYMin meet">'+
      '<g id="gpan" transform="translate('+S.pan.x+','+S.pan.y+') scale('+S.zoom+')">'+
        layerLabels+edgeSvg+nodeSvg+
      '</g>'+
    '</svg>'+
  '</div>';

  $$('.gnode').forEach(n=>{
    n.onclick=e=>{ e.stopPropagation(); openDetail(n.dataset.id,'overview'); };
  });
  wirePan();
}
function zoomBy(d){ S.zoom=Math.max(.4,Math.min(2,S.zoom+d)); render(); }
function wirePan(){
  const svg=$('#gsvg'); if(!svg) return;
  let down=false,sx=0,sy=0,ox=0,oy=0;
  svg.onmousedown=e=>{ if(e.target.closest('.gnode')) return; down=true;sx=e.clientX;sy=e.clientY;ox=S.pan.x;oy=S.pan.y; };
  window.addEventListener('mousemove',e=>{ if(!down)return;
    S.pan={x:ox+(e.clientX-sx),y:oy+(e.clientY-sy)};
    const g=document.getElementById('gpan'); if(g) g.setAttribute('transform','translate('+S.pan.x+','+S.pan.y+') scale('+S.zoom+')'); });
  window.addEventListener('mouseup',()=>down=false);
  // 滚轮缩放：以鼠标位置为缩放中心（缩放时鼠标指向的点保持不动）
  svg.addEventListener('wheel', e=>{
    e.preventDefault();
    const rect=svg.getBoundingClientRect();
    const w=svg.viewBox.baseVal.width, h=svg.viewBox.baseVal.height;
    if(!w||!h||!rect.width||!rect.height) return;
    const k=Math.min(rect.width/w, rect.height/h);
    if(!k) return;
    const mx=(e.clientX-rect.left)/k, my=(e.clientY-rect.top)/k;
    const nz=Math.max(.4,Math.min(2,S.zoom*(e.deltaY<0?1.12:1/1.12)));
    S.pan={ x:mx-(mx-S.pan.x)*(nz/S.zoom), y:my-(my-S.pan.y)*(nz/S.zoom) };
    S.zoom=nz;
    render();
  },{passive:false});
}

function wireDnd(){
  let dragId=null;
  $$('.card').forEach(c=>{
    c.ondragstart=e=>{ dragId=c.dataset.id; c.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; };
    c.ondragend=()=>{ c.classList.remove('dragging'); $$('.column').forEach(x=>x.classList.remove('drag-over')); };
  });
  $$('.column').forEach(col=>{
    col.ondragover=e=>{ e.preventDefault(); col.classList.add('drag-over'); };
    col.ondragleave=()=>col.classList.remove('drag-over');
    col.ondrop=e=>{ e.preventDefault(); col.classList.remove('drag-over');

      doTransition(t.id,to);
    };
  });
}

  S.current=id; S.tab=tab||'overview'; S.replayIdx=null;
  $('#drawer').classList.remove('hidden');
  $('#d-title').textContent='加载中…';
  $('#d-body').innerHTML='<div class="loading">加载中…</div>';

    renderDetail(t);
  }catch(e){

/* ---------- 概览 ---------- */
function tabOverview(t){
  const st=STATUS[t.status]||STATUS.todo;
  const im=impact(t.id);
  const flowSteps=['todo','in_progress','in_review','done'];
  const cur=flowSteps.indexOf(t.status);
  const flow=flowSteps.map((s,i)=>{
    const cls = t.status==='blocked' ? (i<1?'done':'') : i<cur?'done':i===cur?'cur':'';
    const arrow = i<flowSteps.length-1 ? '<span class="farrow '+(flowSteps[i+1]==='done'?'lock':'')+'"></span>' : '';
    return '<span class="fstep '+cls+'"><span class="bub">'+(i<cur?'✓':(i+1))+'</span>'+STATUS[s].label+'</span>'+arrow;
  }).join('');

  const nexts=(TRANSITIONS[t.status]||[]).map(s=>{
    const locked = s==='done' && (!t.review || t.review.verdict!=='passed');
    return '<button class="btn '+(s==='done'?'ok':s==='blocked'?'danger':'')+'" '+(locked?'disabled title="需 Review 通过后才可完成"':'')+' data-trans="'+s+'">→ '+STATUS[s].label+(locked?ic('lock',11):'')+'</button>';
  }).join('');

  const depCards=(t.depends_on||[]).map(d=>{ const dt=byId(d); if(!dt) return '';
    return '<div class="irow" data-id="'+d+'">'+
      '<span class="tid">'+dt.id+'</span>'+
      '<span style="flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(dt.title)+'</span>'+
      '<span class="badge" style="color:'+(STATUS[dt.status]||STATUS.todo).color+';border-color:'+(STATUS[dt.status]||STATUS.todo).color+'44">'+(STATUS[dt.status]||STATUS.todo).label+'</span>'+
    '</div>';}).join('') || '<div class="muted" style="font-size:12px">无前置依赖，可直接开工</div>';

  const unread=(t.notices||[]).filter(n=>!n.read);

  let html='';
  if(t.blocked_reason) html+='<div class="blocked-note" style="font-size:12px;padding:9px 12px;margin-bottom:16px"><span>⚠</span><span><b>阻塞原因：</b>'+esc(t.blocked_reason)+'</span></div>';
  if(unread.length){
    html+='<div class="sec"><h3 style="color:var(--review)">'+ic('bell',12)+' 上游提醒 <span class="line"></span><button class="btn sm" id="btn-mark-read">标记已读</button></h3>';
    html+=unread.map(n=>'<div class="notice-item unread" onclick="setTab(&#39;impact&#39;)"><span class="nt">'+esc((n.at||'').slice(5,16).replace('T',' '))+'</span><span class="nb">'+esc(n.message)+'</span></div>').join('');
    html+='<div class="hint">上游任务一有改动就会推到这里，避免「改了 A 忘了 B」。</div></div>';
  }
  html+='<div class="sec"><h3>状态流转 <span class="line"></span></h3>';
  html+='<div class="flow">'+flow+'</div>';
  html+='<div style="display:flex;gap:7px;margin-top:10px;flex-wrap:wrap">'+(nexts||'<span class="muted" style="font-size:12px">终态，无可用流转</span>')+'</div>';
  if(t.status==='in_review') html+='<div class="hint">'+ic('lock',11)+' 「已完成」需 Review verdict = passed。当前：<b>'+(t.review&&t.review.verdict==='passed'?'已通过':'待确认')+'</b></div>';
  html+='</div>';

  html+='<div class="sec"><h3>描述 <span class="line"></span></h3><p class="prose">'+(descHTML(t.description)||'<span class="muted">—</span>')+'</p></div>';

  const atts=(t.attachments||[]);

    html+='<div class="sec"><h3>'+ic('image',12)+' UI 图 / 附件 <span class="line"></span>'+
