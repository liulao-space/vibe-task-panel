/* ---------- 改动记录 ---------- */
function diffHTMLFromText(diff){
  if(!diff) return '<div class="diffbox"><div class="diff-hd">diff 未生成</div>'+
    '<div style="padding:12px;font-size:11.5px;color:var(--text-3)">该改动尚未提交，点「同步未提交改动」可从工作区收集。</div></div>';
  const lines=String(diff).split(String.fromCharCode(10));
  let add=0, del=0;
  const rows=lines.map(l=>{
    if(l.indexOf('@@')===0) return {t:'hunk', s:l};
    if(l.charAt(0)==='+'){ add++; return {t:'add', s:l}; }
    if(l.charAt(0)==='-'){ del++; return {t:'del', s:l}; }
    return {t:'ctx', s:l};
  });
  return '<div class="diffbox">'+
    '<div class="diff-hd"><span>unified diff</span><span class="stat"><span class="add">+'+add+'</span><span class="del">−'+del+'</span></span></div>'+
    '<div class="diff-body">'+rows.map(d=>'<div class="dl-line '+d.t+'"><span class="ln"></span>'+esc(d.s)+'</div>').join('')+'</div>'+
  '</div>';
}
function tabChanges(t){
  let html='<div class="sec"><h3>改动记录 <span class="line"></span>'+
    '<button class="btn sm" id="btn-sync-changes">'+ic('sync')+'同步未提交改动</button></h3>';
  html+='<div class="tl">'+((t.changes||[]).map((c,i)=>'<div class="tlitem change">'+
    '<div class="tl-head"><span class="tl-time">'+fmt(c.at)+'</span>'+
      '<span class="stat"><span class="add">+'+(c.add||0)+'</span><span class="del">−'+(c.del||0)+'</span></span></div>'+
    '<div class="tl-card">'+
      '<div class="commit-line"><span class="sha">'+esc(c.commit||'')+'</span>'+
        '<span style="color:var(--text-3)">'+esc((c.file_paths||[]).join('  ·  '))+'</span></div>'+
      '<div class="tl-sum">'+esc(c.diff_summary)+'</div>'+
      (c.rationale?'<div class="decision"><span class="dl">为什么改</span>'+esc(c.rationale)+'</div>':'')+
      '<div style="margin-top:8px;display:flex;gap:6px">'+
        (c.diff?'<button class="btn sm diff-toggle" data-idx="'+i+'">查看 diff</button>':'')+
        ((c.commit && c.commit!=='(未提交)' && c.commit!=='pending')?'<button class="btn sm commit-diff" data-idx="'+i+'">查看 commit diff</button>':'')+
      '</div>'+
      '<div id="diff-'+i+'" class="hidden">'+diffHTMLFromText(c.diff)+'</div>'+
    '</div></div>').join('')||'<div class="muted" style="font-size:12px">暂无改动记录</div>')+'</div></div>';
  return html;
}
function toggleDiff(t, i){
  const el=document.getElementById('diff-'+i); if(!el) return;
  el.classList.toggle('hidden');
}
async function toggleCommitDiff(t, i){
  const el=document.getElementById('diff-'+i); if(!el) return;
  if(!el.classList.contains('hidden')){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  if(el.getAttribute('data-loaded')) return;
  el.innerHTML='<div class="loading" style="padding:12px">加载 diff…</div>';
  try{
    const d=await api('/api/tasks/'+t.id+'/changes/'+i+'/diff');
    el.innerHTML=diffHTMLFromText(d.diff);
    el.setAttribute('data-loaded','1');
  }catch(e){ el.innerHTML='<div class="error" style="padding:12px">'+esc(e.message)+'</div>'; }
}

async function runImpact(id){
  const el=$('#impact-result'); if(!el) return;
  el.innerHTML='<div class="loading">分析中…</div>';
  try{
    const data=await api('/api/impact/'+id);
    const riskLabel={high:'高风险',medium:'中风险',low:'低风险'}[data.risk&&data.risk.level]||'';
    const ranked=(data.affectedRanked||[]).map(a=>{
      const m=STATUS[a.status];
      return '<div class="irow" data-id="'+esc(a.id)+'">'+
        '<span class="risk '+esc(a.risk_level)+'">'+({high:'高风险',medium:'中风险',low:'低风险'}[a.risk_level]||a.risk_level)+'</span>'+
        '<span class="tid">'+esc(a.id)+'</span>'+
        '<span style="flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(a.title||'')+'</span>'+
        (m?'<span class="badge" style="color:'+m.color+';border-color:'+m.color+'44">'+m.label+'</span>':'')+
        '<span class="why">风险 '+a.risk_score+' · 下游 '+a.downstream_count+' · 共享 '+(a.shared_file_count||0)+'</span>'+
      '</div>';
    }).join('');
    const list=(arr)=>!arr||!arr.length?'<div class="muted" style="font-size:12px">无</div>':arr.map(x=>{
      const m=STATUS[x.status];
      return '<div class="irow" data-id="'+esc(x.id||'')+'">'+
        '<span class="tid">'+esc(x.id||'')+'</span>'+
        '<span style="flex:1;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(x.title||'')+'</span>'+
        (m?'<span class="badge" style="color:'+m.color+';border-color:'+m.color+'44">'+m.label+'</span>':'')+
        ((x.files&&x.files.length)?'<span class="why">'+esc(x.files.join(', '))+'</span>':'')+
      '</div>';
    }).join('');
    const regression=(data.regression||[]).map(r=>'<div class="check"><span class="ic">'+ic('test',12)+'</span><span class="nm">'+esc(r)+'</span></div>').join('');
    let html='<div class="impact-summary">'+
      '<div class="isum '+(data.affected&&data.affected.length?'warn':'')+'"><div class="n">'+(data.affected||[]).length+'</div><div class="l">受影响任务</div></div>'+
      '<div class="isum"><div class="n">'+(data.sharedFiles||[]).length+'</div><div class="l">共享文件</div></div>'+
      '<div class="isum '+(data.risk&&data.risk.high_count?'danger':'')+'"><div class="n">'+(data.risk?data.risk.high_count:0)+'</div><div class="l">高风险</div></div>'+
    '</div>';
    html+='<div class="path-viz" style="color:var(--text-2)">'+esc(data.summary||'')+' '+(riskLabel?'<b style="color:'+(data.risk.level==='high'?'var(--block)':data.risk.level==='medium'?'var(--review)':'var(--done)')+'">· '+riskLabel+'</b>':'')+'</div>';
    html+='<div class="sec" style="margin-bottom:14px"><h3>风险排序 <span class="line"></span></h3>'+ranked+'</div>';
    html+='<div class="sec" style="margin-bottom:14px"><h3>回归测试建议 <span class="line"></span></h3>'+(regression||'<div class="muted" style="font-size:12px">无</div>')+'</div>';
    html+='<div class="sec" style="margin-bottom:14px"><h3>受影响 affected <span class="line"></span></h3>'+list(data.affected)+'</div>';
    html+='<div class="sec" style="margin-bottom:14px"><h3>下游 downstream <span class="line"></span></h3>'+list(data.downstream)+'</div>';
    html+='<div class="sec" style="margin-bottom:14px"><h3>上游 upstream <span class="line"></span></h3>'+list(data.upstream)+'</div>';
    html+='<div class="sec" style="margin-bottom:14px"><h3>共享文件 sharedFiles <span class="line"></span></h3>'+
      ((data.sharedFiles||[]).map(f=>'<div class="filerow"><span class="path">'+esc(f)+'</span></div>').join('')||'<div class="muted" style="font-size:12px">无</div>')+'</div>';
    el.innerHTML=html;
    el.querySelectorAll('.irow[data-id]').forEach(item=>{
      item.onclick=e=>{ if(e.target.closest('button')) return; openDetail(item.getAttribute('data-id')); };
    });
  }catch(e){
    el.innerHTML='<div class="error">'+esc(e.message)+'</div>';

  const box=$('#d-body'); if(box) box.style.opacity='.45';

/* ---------- Review 门禁 ---------- */
function tabReview(t){
  const c=(t.review&&t.review.check_results)||{};
  const has=Object.keys(c).length;
  const ico=v=>String(v).startsWith('pass')?'<span class="pass">✓</span>':String(v).startsWith('fail')?'<span class="fail">✕</span>':'<span class="pend">◌</span>';
  const g=gateReady(t);
  const v=t.review?t.review.verdict:'pending';
  const lc=lastChecks[t.id]||null;
  const ai=(lc&&lc.ai)||(t.review&&t.review.ai)||null;
  const autoInfo = t.review&&t.review.last_auto ? t.review.last_auto : null;

  let aiHtml='';
  if(ai && ai.error) aiHtml='<div class="ai-finding sev-high"><div class="af-head"><span class="af-cat">错误</span></div><div class="af-b">'+esc(ai.error)+'</div></div>';
  else if(ai && Array.isArray(ai)) aiHtml=ai.map(a=>'<div class="ai-finding"><div class="af-b">'+esc(typeof a==='string'?a:JSON.stringify(a))+'</div></div>').join('')||'<div class="muted" style="font-size:12px">尚无审查意见</div>';
  else if(ai && typeof ai==='object'){
    if(ai.summary) aiHtml+='<div class="ai-finding"><div class="af-head"><span class="af-cat">改动总结</span></div><div class="af-b">'+esc(ai.summary)+'</div></div>';
    if(ai.quality) aiHtml+='<div class="ai-finding"><div class="af-head"><span class="af-cat">代码质量</span></div><div class="af-b">'+esc(ai.quality)+'</div></div>';
    (ai.issues||[]).forEach(iss=>{
      const sev=iss.severity||'info';
      const cls=sev==='blocker'?'sev-high':sev==='suggestion'?'sev-mid':'sev-low';
      aiHtml+='<div class="ai-finding '+cls+'"><div class="af-head"><span class="af-cat">'+esc(sev)+'</span><span class="af-t">'+esc(iss.title||'')+'</span></div><div class="af-b">'+esc(iss.content||'')+(iss.suggestion?' → '+esc(iss.suggestion):'')+'</div></div>';
    });
    (ai.acceptance_check||[]).forEach(chk=>{
      const mark=chk.satisfied?'✓':'✗';
      const cls=chk.satisfied?'sev-low':'sev-high';
      aiHtml+='<div class="ai-finding '+cls+'"><div class="af-head"><span class="af-cat">验收</span></div><div class="af-b">'+mark+' '+esc(chk.criterion||'')+(chk.note?'（'+esc(chk.note)+'）':'')+'</div></div>';
    });
    if(ai.verdict){
      const ok=ai.verdict==='approve';
      aiHtml+='<div class="ai-finding '+(ok?'sev-low':'sev-high')+'"><div class="af-head"><span class="af-cat">结论</span></div><div class="af-b">'+(ok?'通过':'打回')+(ai.verdict_reason?' - '+esc(ai.verdict_reason):'')+'</div></div>';
    }
    if(!aiHtml) aiHtml='<div class="muted" style="font-size:12px">AI 审查未返回意见</div>';
  } else if(autoInfo){
    aiHtml='<div class="ai-finding"><div class="af-head"><span class="af-cat">上次自动检查</span><span class="af-t">'+(autoInfo.passed?'通过':'未通过')+'</span></div><div class="af-b">'+esc(autoInfo.summary||'')+'</div></div>';
  } else {
    aiHtml='<div class="muted" style="font-size:12px">尚未运行 AI 审查</div>';
  }

  const im=impact(t.id);
  let gate1='<div class="gate-card">'+
    '<div class="gate-hd"><span class="num">1</span><span class="t">自动门禁</span>'+
      '<span class="st">'+(g==='pass'?'<span class="pass">全部通过</span>':g==='fail'?'<span class="fail">存在失败</span>':g==='pending'?'<span class="warnc">运行中…</span>':'<span class="pend">未运行</span>')+'</span></div>'+
    '<div class="gate-bd">'+
      (has?['lint','typecheck','test'].map(k=>'<div class="check">'+
        '<span class="ic">'+ico(c[k])+'</span><span class="nm">'+k+'</span>'+
        '<span class="out">'+esc(c[k]||'—')+'</span></div>').join('')
        :'<div class="muted" style="font-size:12px">进入「待审查」时自动触发 lint / typecheck / test</div>')+
      (lc&&!lc.autoPassed&&lc.auto?'<div class="ai-finding sev-high" style="margin-top:9px"><div class="af-head"><span class="af-cat">自动检查</span></div><div class="af-b">'+esc(lc.auto.summary||'')+'</div></div>':'')+
      '<div style="margin-top:10px"><button class="btn" id="btn-run-checks">↻ 运行检查</button></div>'+
    '</div></div>';

  let gate2='<div class="gate-card">'+
    '<div class="gate-hd"><span class="num">2</span><span class="t">AI 审查</span>'+
      '<span class="st"><span class="pend">'+(lc?'已运行':'未运行')+'</span></span></div>'+
    '<div class="gate-bd">'+
      '<div style="font-size:11.5px;color:var(--text-3);margin-bottom:10px;line-height:1.7">'+
        '输入 = 任务 diff · 描述 · 验收标准 · <b style="color:var(--review)">依赖影响报告（'+im.items.length+' 个下游任务）</b><br>'+
        '输出 = 正确性 / 是否满足验收 / 是否破坏下游依赖 / 可维护性</div>'+
      aiHtml+
      '<div style="margin-top:8px"><button class="btn" id="btn-run-ai">'+ic('bot')+'运行 AI 审查</button></div>'+
    '</div></div>';

  let gate3='<div class="gate-card">'+
    '<div class="gate-hd"><span class="num">3</span><span class="t">人工确认</span>'+
      '<span class="st">'+(v==='passed'?'<span class="pass">已通过</span>':v==='rejected'?'<span class="fail">已打回</span>':'<span class="warnc">待确认</span>')+'</span></div>'+
    '<div class="gate-bd">'+
      '<div class="verdict-bar '+(v==='pending'?'pending':'')+'">'+
        '<span style="display:inline-flex;color:'+(v==='passed'?'var(--done)':v==='rejected'?'var(--block)':'var(--review)')+'">'+ic(v==='passed'?'check':v==='rejected'?'ban':'hourglass',16)+'</span>'+
        '<span class="txt">'+(v==='passed'?'已由 <b>'+esc((t.review&&t.review.reviewer)||'—')+'</b> 通过，任务可标记「已完成」'
          :v==='rejected'?'已打回，修复后重新提交审查'
          :'检查与审查已就绪，等待人工确认')+'</span>'+
        (v==='pending'?'<span class="acts">'+
          '<button class="btn ok" id="btn-approve">通过</button>'+
          '<button class="btn warn" id="btn-force-approve">强制通过</button>'+
          '<button class="btn danger" id="btn-reject">打回</button>'+
        '</span>':'')+
      '</div>'+
      (lc?'<div class="hint">最近一次检查：'+(lc.autoPassed?'<span class="pass">全部通过</span>':'<span class="fail">未全部通过</span>')+(lc.impact?' · 影响 '+(lc.impact.affected||[]).length+' 个下游任务':'')+'</div>':'')+
      '<div class="hint">'+ic('lock',11)+' 状态机硬约束：只有 verdict = passed 才允许「待审查 → 已完成」。</div>'+
    '</div></div>';

  const reviewComments=((t.review&&t.review.comments)||[]).map(cm=>{
    const txt=typeof cm==='string'?cm:((cm&&(cm.text||cm.message))||JSON.stringify(cm));
    return '<div class="cmt"><span class="avatar" style="background:var(--panel-3);color:var(--text-2)">R</span>'+
      '<div class="cmt-b"><div class="cmt-x">'+esc(txt)+'</div></div></div>';
  }).join('');

  return '<div class="sec"><h3>三层门禁 <span class="line"></span></h3>'+gate1+gate2+gate3+'</div>'+
    (reviewComments?'<div class="sec"><h3>Review 评论 <span class="line"></span></h3>'+reviewComments+'</div>':'');
}

/* ---------- 回看模式 ---------- */
function buildTimeline(t){
  const ev=[];
  (t.sessions||[]).forEach(s=>ev.push({at:s.at,kind:(s.role==='system'?'status':'session'),data:s}));
  (t.changes||[]).forEach(c=>ev.push({at:c.at,kind:'change',data:c}));
  if(t.review&&t.review.verdict!=='pending'&&t.review.verdict){
    const last=(t.changes&&t.changes.slice(-1)[0]&&t.changes.slice(-1)[0].at)||(t.sessions&&t.sessions.slice(-1)[0]&&t.sessions.slice(-1)[0].at);
    ev.push({at:last,kind:'review',data:t.review});
  }
  return ev.filter(e=>e.at).sort((a,b)=>new Date(a.at)-new Date(b.at));
}
function tabReplay(t){
  const ev=buildTimeline(t);
  if(!ev.length) return '<div class="emptystate" style="height:auto;padding:60px 20px"><div class="big">'+ic('clock',32)+'</div>'+
    '<div class="t">还没有可回看的历史</div>'+
    '<div class="d">任务一旦开始推进，会话摘要、改动 diff、审查结论都会按时间轴沉淀在这里。</div></div>';
  const idx = S.replayIdx==null ? ev.length-1 : S.replayIdx;
  const cur = ev[idx];
  const ticks=ev.map((e,i)=>'<div class="tick '+e.kind+' '+(i<=idx?'on':'')+'" style="left:'+(ev.length===1?0:(i/(ev.length-1))*100)+'%"'+
      ' onclick="S.replayIdx='+i+';renderDetail(byId(S.current))" title="'+fmt(e.at)+' · '+e.kind+'"></div>').join('');

  let snapshot=(()=>{
    const upto=ev.slice(0,idx+1);
    const sess=upto.filter(e=>e.kind==='session').length;
    const chg=upto.filter(e=>e.kind==='change');
    const add=chg.reduce((s,e)=>s+(e.data.add||0),0), del=chg.reduce((s,e)=>s+(e.data.del||0),0);
    const decisions=upto.filter(e=>e.kind==='session'&&e.data.decision);
    return '<div class="impact-summary" style="grid-template-columns:repeat(4,1fr)">'+
      '<div class="isum"><div class="n">'+sess+'</div><div class="l">会话轮次</div></div>'+
      '<div class="isum"><div class="n">'+decisions.length+'</div><div class="l">关键决策</div></div>'+
      '<div class="isum"><div class="n">'+chg.length+'</div><div class="l">改动批次</div></div>'+
      '<div class="isum"><div class="n" style="font-size:15px;padding-top:5px"><span class="pass">+'+add+'</span> <span class="fail">−'+del+'</span></div><div class="l">代码增删</div></div>'+
    '</div>';})();

  let body;
  if(cur.kind==='change'){
    body='<div class="tl-card"><div class="commit-line"><span class="sha">'+esc(cur.data.commit)+'</span>'+
      '<span style="color:var(--text-3)">'+esc((cur.data.file_paths||[]).join(' · '))+'</span></div>'+
      '<div class="tl-sum">'+esc(cur.data.diff_summary)+'</div>'+
      (cur.data.rationale?'<div class="decision"><span class="dl">为什么改</span>'+esc(cur.data.rationale)+'</div>':'')+
      diffHTMLFromText(cur.data.diff)+'</div>';
  } else if(cur.kind==='review'){
    body='<div class="tl-card"><div class="tl-sum">Review '+(cur.data.verdict==='passed'?'通过':'打回')+' · reviewer '+esc(cur.data.reviewer||'—')+'</div>'+
      '<div style="margin-top:8px">'+['lint','typecheck','test'].map(k=>{
        const cv=(cur.data.check_results||{})[k];
        return '<div class="check"><span class="ic">'+((cv||'').startsWith('pass')?'<span class="pass">✓</span>':'<span class="fail">✕</span>')+'</span><span class="nm">'+k+'</span><span class="out">'+esc(cv||'—')+'</span></div>';
      }).join('')+'</div></div>';
  } else {
    body='<div class="tl-card"><div class="tl-sum">'+esc(cur.data.summary)+'</div>'+
      (cur.data.decision?'<div class="decision"><span class="dl">决策</span>'+esc(cur.data.decision)+'</div>':'')+'</div>';
  }

  let html='<div class="scrub">'+
    '<div class="scrub-top">'+
      '<span class="t">'+ic('clock')+' 回看模式</span>'+
      '<span class="muted" style="font-size:11.5px">第 '+(idx+1)+' / '+ev.length+' 个事件</span>'+
      '<span class="stamp">'+fmt(cur.at)+'</span>'+
    '</div>'+
    '<div class="track">'+
      '<div class="rail"></div>'+
      '<div class="fill" style="width:'+(ev.length===1?100:(idx/(ev.length-1))*100)+'%"></div>'+
      ticks+
    '</div>'+
    '<div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">'+
      '<button class="btn sm" onclick="S.replayIdx='+Math.max(0,idx-1)+';renderDetail(byId(S.current))">← 上一步</button>'+
      '<button class="btn sm" onclick="S.replayIdx='+Math.min(ev.length-1,idx+1)+';renderDetail(byId(S.current))">下一步 →</button>'+
      '<button class="btn sm" onclick="playReplay('+ev.length+')">'+ic('play',11)+'自动播放</button>'+
      '<button class="btn sm" style="margin-left:auto" onclick="S.replayIdx=null;renderDetail(byId(S.current))">回到最新</button>'+
    '</div>'+
  '</div>';
  html+='<div class="sec"><h3>当时的状态快照 <span class="line"></span></h3>'+snapshot+'</div>';
  html+='<div class="sec"><h3>'+(cur.kind==='change'?'改动':cur.kind==='review'?'审查':cur.kind==='status'?'状态变更':'会话')+' · '+fmt(cur.at)+' <span class="line"></span></h3>'+body+'</div>';
  html+='<div class="sec"><h3>完整时间轴 <span class="line"></span></h3>'+
    '<div class="tl">'+ev.map((e,i)=>'<div class="tlitem '+e.kind+'" style="opacity:'+(i<=idx?1:.4)+';cursor:pointer" onclick="S.replayIdx='+i+';renderDetail(byId(S.current))">'+
      '<div class="tl-head"><span class="tl-time">'+fmt(e.at)+'</span>'+
        '<span class="tl-role '+(e.kind==='session'?(e.data.role||''):'')+'">'+({session:'会话',change:'改动',review:'审查',status:'状态'}[e.kind])+'</span>'+
        (i===idx?'<span class="badge" style="color:var(--accent);border-color:rgba(63,193,169,.4)">当前</span>':'')+'</div>'+
      '<div class="tl-card"><div class="tl-sum">'+esc(e.kind==='change'?e.data.diff_summary:e.kind==='review'?('Review '+(e.data.verdict==='passed'?'通过':'打回')):(e.data.summary||''))+'</div></div>'+
    '</div>').join('')+'</div></div>';
  return html;
}

async function doTransitionSubmit(id,to,reason){
  try{
    const t=await api('/api/tasks/'+id+'/transition',{method:'POST',body:{to:to,reason:reason||null}});
    taskCache[id]=t;
    toast('已流转到「'+STATUS[to].label+'」','ok');

// 轮询异步 AI 审查结果（最多约 90 秒），完成后自动刷新详情
function pollAutoReview(id){
  let n=0;
  const iv=setInterval(async ()=>{
    n++;
    try{
      const t=await api('/api/tasks/'+id);
      if(t.review&&t.review.ai){
        clearInterval(iv);
        taskCache[id]=t;
        toast('AI 代码审查已完成，已自动生成审查报告','ok');
        if(S.current===id) renderDetail(t);
        await refreshAll(); render();
      }else if(n>=30){
        clearInterval(iv);
        toast('AI 审查仍在进行中，稍后可在任务详情查看','info');
      }
    }catch(err){ clearInterval(iv); }
  },3000);
}

async function runReview(id,action){
  if(action==='reject'){
    let def='';
    try{
      const t=await api('/api/tasks/'+id);
      const r=t.review||{}; const lines=[];
      (r.comments||[]).forEach(function(c){ lines.push(c); });
      // 自动门禁失败项（lint / typecheck / test / 验收 / 文件）
      const cr=r.check_results||{};
      const failMap={lint:'lint',typecheck:'typecheck',test:'test',acceptance:'验收标准',files_exist:'关联文件',deps:'依赖检查'};
      Object.keys(failMap).forEach(function(k){
        const v=cr[k];
        if(v&&String(v).indexOf('fail')===0) lines.push('□ 自动检查未通过 — '+(failMap[k])+(String(v).length>4?'：'+v:''));
      });
      // AI 审查的验收不通过项与问题
      const ai=r.ai;
      if(ai){
        if(ai.verdict==='reject'&&ai.verdict_reason) lines.push('■ AI 审查不通过：'+ai.verdict_reason);
        (ai.acceptance_check||[]).forEach(function(a){ if(a.satisfied===false) lines.push('□ 验收不通过：'+a.criterion+(a.note?'（'+a.note+'）':'')); });
        (ai.issues||[]).forEach(function(iss){ lines.push('□ '+(iss.severity||'问题')+'：'+iss.content+(iss.suggestion?' → '+iss.suggestion:'')); });
      }
      def=lines.join(String.fromCharCode(10));
    }catch(e){}
    showTextareaDialog('打回意见','请输入打回意见（可多行，已自动回填验收不通过的原因）',def,function(comment){
      runReviewSubmit(id,action,{comments:[comment]});
    });
    return;
  }
  if(action==='approve'||action==='force_approve'){
    showInputDialog('Reviewer','请输入 reviewer（可留空）','',function(reviewer){
      const extra={}; if(reviewer) extra.reviewer=reviewer;
      runReviewSubmit(id,action,extra);
    });
    return;
  }
  runReviewSubmit(id,action,{});
}
async function runReviewSubmit(id,action,extra){
  let el=$('#review-result');
  if(!el){ const b=$('#d-body'); if(!b) return; el=document.createElement('div'); el.id='review-result'; b.appendChild(el); }
  const body=Object.assign({action:action},extra||{});
  el.innerHTML='<div class="loading">处理中…</div>';
  try{
    const res=await api('/api/tasks/'+id+'/review',{method:'POST',body:body});
    if(action==='run_checks'){
      lastChecks[id]=res;
      const t=await api('/api/tasks/'+id);
      taskCache[id]=t;
      renderDetail(t);
      toast(res.autoPassed?'检查全部通过':'检查未全部通过，详见 Review 门禁', res.autoPassed?'ok':'warn');
    }else{
      toast(action==='reject'?'已打回，任务回到「进行中」':'操作成功','ok');
      await refreshAll();
      render();
      const t=await api('/api/tasks/'+id);
      taskCache[id]=t;
      renderDetail(t);
    }
  }catch(e){
    el.innerHTML='<div class="error">'+esc(e.message)+'</div>';
    toast(e.message,'err');
  }
}

function descHTML(text){

  if(!p || !p.trim()) return;

function uploadAttachment(t){
  const inp=document.createElement('input');
  inp.type='file';
  inp.accept='image/png,image/jpeg,image/webp,image/gif,image/svg+xml';
  inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return;
    const extMap={'image/png':'png','image/jpeg':'jpeg','image/webp':'webp','image/gif':'gif','image/svg+xml':'svg'};
    const fmt=extMap[f.type]||'png';
    const reader=new FileReader();
    reader.onload=async()=>{
      try{
        const dataUrl=String(reader.result||'');
        const base64=dataUrl.split(',')[1]||'';
        const r=await api('/api/notes',{method:'POST',body:{taskId:t.id,format:fmt,data:base64}});
        const cur=await api('/api/tasks/'+t.id);
        const atts=(cur.attachments||[]).slice();
        atts.push({path:r.relPath,label:f.name,kind:'note'});
        patchTaskRefresh(t.id,{attachments:atts,ui_status:cur.ui_status==='pending'?'ready':cur.ui_status},'已上传并登记图片');
      }catch(e){ toast(e.message,'err'); }
    };
    reader.readAsDataURL(f);
  };
  inp.click();
}
function deleteAttachment(t, idx){
  const a = (t.attachments||[])[idx];
  if(!a) return;
  // 先弹自定义确认框（同步弹出，不依赖 user activation），确认后再发请求
  showConfirmDialog('删除附件', '该附件将从任务中移除，可随时重新登记。', async function(){
    try{
      const cur = await api('/api/tasks/'+t.id);

      if(!list[idx]){ toast('附件列表已变化，请重试','err'); renderDetail(cur); return; }
      list.splice(idx,1);
      patchTaskRefresh(t.id, {attachments: list}, '已删除附件');
    }catch(e){ toast(e.message,'err'); }
  }, { chip: (a.label||a.path) });
}

async function runDecompose(){
  const btn=$('#dec-run'); if(!btn) return; btn.disabled=true; btn.textContent='拆解中…';
  const out=$('#dec-out');
  out.innerHTML='<div class="field" style="margin-top:4px"><label>执行日志</label><div class="term" id="term"></div></div>';
  const term=$('#term');
  term.innerHTML='<span class="dim">$</span> 正在请求后端拆解…<span class="cursor"></span>';
  const docPath=$('#dec-doc').value;
  const text=$('#dec-text').value.trim();
  try{
    const asg=$('#dec-assignee').value.trim();
    const clearOld=document.querySelector('input[name=dec-mode]:checked')&&document.querySelector('input[name=dec-mode]:checked').value==='clear';
    const res=await api('/api/decompose',{method:'POST',body:Object.assign({}, docPath?{docPath:'docs/'+docPath}:{text:text}, asg?{assignee:asg}:{}, clearOld?{clearOld:true}:{})});
    term.innerHTML='<span class="dim">$</span> decompose '+(docPath||'<粘贴文本>')+'<br>'+
      '<span class="ok">✓ 完成：需求「'+esc(res.requirement||'')+'」拆出 '+res.tasks.length+' 个任务（'+esc(res.mode||'')+' · '+(res.cleared>0?'已清空 '+res.cleared+' 个旧任务':'追加模式，旧任务保留')+'）</span>';
    let listHtml='<div class="field" style="margin-top:10px"><label>拆解结果（已写入 tasks/）</label>';
    listHtml+=(res.tasks.map(t=>'<div class="propose"><div class="pp-head">'+
      '<span class="tid">'+esc(t.id)+'</span><span class="pp-title">'+esc(t.title)+'</span>'+
      '<span class="badge" style="color:var(--todo);border-color:var(--border-2)">'+esc(t.status||'todo')+'</span>'+
      '<button class="btn sm" onclick="closeModal();openDetail(&#39;'+esc(t.id)+'&#39;,&#39;overview&#39;)">查看 →</button></div>'+
      '<div class="pp-body">'+
        ((t.depends_on||[]).length?'<div class="row"><span class="lbl">依赖</span><span>'+(t.depends_on||[]).map(d=>'<span class="dep-chip">'+esc(d)+'</span>').join('')+'</span></div>':'')+
        (t.assignee?'<div class="row"><span class="lbl">负责人</span><span>'+esc(t.assignee)+'</span></div>':'')+
        ((t.acceptance||[]).length?'<div class="row"><span class="lbl">验收</span><span>'+(t.acceptance||[]).map(a=>'· '+esc(a)).join('<br>')+'</span></div>':'')+
      '</div></div>').join('')||'<div class="muted">（未生成任务）</div>');
    listHtml+='</div>';
    out.innerHTML += listHtml;
    toast('拆解完成：'+res.tasks.length+' 个任务已写入','ok');
    await refreshAll(); render();
  }catch(e){
    term.innerHTML='<span class="fail">✕ 拆解失败：'+esc(e.message)+'</span>';
    toast(e.message,'err');
  }finally{
    btn.disabled=false; btn.textContent='⚡ 重新拆解';
  }
}

let crTasks=[], crIdx=0;   // 代码回顾弹窗的题目列表与当前题号

// 轻量语法高亮：注释 / 字符串 / 模板串 / 关键字 / 数字
function hl(code){
  return String(code).replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/|'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`|\b(?:const|let|var|function|return|if|else|for|while|import|export|from|async|await|class|new|this|typeof|instanceof|throw|try|catch|finally|switch|case|default|break|continue|do|void|delete|in|of|extends|super|yield|static|get|set|true|false|null|undefined)\b|\b\d+(?:\.\d+)?\b)/g, function(m){
    if(m[0]==='/') return '<span class="tk-c">'+esc(m)+'</span>';
    if(m[0]==='\''||m[0]==='"'||m[0]==='`') return '<span class="tk-s">'+esc(m)+'</span>';
    if(/d/.test(m[0])) return '<span class="tk-n">'+esc(m)+'</span>';
    return '<span class="tk-k">'+esc(m)+'</span>';
  });
}
// 复制代码片段到剪贴板（有反馈）
function copySnippet(btn){
  const card=btn.closest('.cr-card');
  const t=card?byId(card.getAttribute('data-task')):null;
  const idx=Number(btn.getAttribute('data-s'));
  const snips=(t&&t.review&&t.review.ai&&t.review.ai.learning&&t.review.ai.learning.snippets)||[];
  const code=(snips[idx]&&snips[idx].code)||'';
  if(!code){ toast('没有可复制的代码','warn'); return; }
  const done=function(){ const old=btn.textContent; btn.textContent='✓ 已复制'; setTimeout(function(){ btn.textContent=old; },1500); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(done).catch(function(){ toast('复制失败','err'); });
  } else {
    const ta=document.createElement('textarea'); ta.value=code; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败','err'); }
    document.body.removeChild(ta);
  }
}
// 单个任务的学习卡片（弹窗与详情 tab 共用；inHub=true 显示头部+「查看任务」，详情 tab 只显示学习内容）
function codeReviewCardHTML(t,inHub){
  const r=t.review||{}; const ai=r.ai; const ss=t.sessions||[]; const parts=[];
  // ① AI 思路总结：编写前中后的思考 / 编排 / 验收核对
  let think='';
  if(ai){
    if(ai.summary) think+='<div class="af-b"><b>本次改了什么 / 为什么</b>：'+esc(ai.summary)+'</div>';
    if(ai.quality) think+='<div class="af-b"><b>代码质量评估</b>：'+esc(ai.quality)+'</div>';
    if(ai.verdict) think+='<div class="af-b"><b>审查结论</b>：'+(ai.verdict==='approve'?'<span class="pass">通过 ✓</span>':'<span class="fail">不通过 ✕</span>')+(ai.verdict_reason?' — '+esc(ai.verdict_reason):'')+'</div>';
    (ai.acceptance_check||[]).forEach(function(a){
      think+='<div class="af-b">'+(a.satisfied?'<span class="pass">✓ 验收满足</span>':'<span class="fail">✗ 验收未过</span>')+' '+esc(a.criterion||'')+(a.note?'（'+esc(a.note)+'）':'')+'</div>';
    });
  }
  ss.forEach(function(s){
    if(s.summary) think+='<div class="af-b"><b>思考过程'+(s.role?'［'+esc(s.role)+'］':'')+'</b>：'+esc(s.summary)+'</div>';
    if(s.decision) think+='<div class="af-b"><b>关键决策 · 编排</b>：'+esc(s.decision)+'</div>';
  });
  if(think) parts.push('<div class="sec"><h4><span class="sec-bar" style="background:#2fb99c"></span>AI 思路总结</h4>'+think+'</div>');
  // ② 优质代码片段：语法高亮 + 一键复制 + 主题切换；讲解足够长时自动生成笔记风图片
  const snips=(ai&&ai.learning&&ai.learning.snippets)||[];
  if(snips.length){
    parts.push('<div class="sec"><h4><span class="sec-bar" style="background:#f2a33c"></span>优质代码片段</h4>'+
      snips.map(function(s,i){
        let b='<div class="snip"><div class="snip-h">'+
          '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(s.title||('片段 '+(i+1)))+'</span>'+
          (s.code?'<button class="btn sm snip-theme" title="切换代码主题">🎨</button>':'')+
          (s.code?'<button class="btn sm snip-copy" data-s="'+i+'">复制</button>':'')+
          '</div>'+
          (s.code?'<pre class="snip-code">'+hl(s.code)+'</pre>':'');
        if(s.note) b+='<div class="snip-note">💡 '+fmtPoints(s.note)+'</div>';
        return b+'</div>';
      }).join('')+'</div>');
  }
  // ③ 设计思维 + 知识点：内容足够长时自动生成笔记风图片
  const lk=(ai&&ai.learning)||{};
  let dk='';
  if(lk.design) dk+='<div class="af-b"><b>设计思维</b>：'+fmtPoints(lk.design)+'</div>';
  if(lk.knowledge) dk+='<div class="af-b"><b>知识点</b>：'+fmtPoints(lk.knowledge)+'</div>';
  if(dk) parts.push('<div class="sec"><h4><span class="sec-bar" style="background:#5b9cf5"></span>设计思维 & 知识点</h4>'+dk+'</div>');
  // ④ 面试考点：内容足够长时自动生成笔记风图片
  if(lk.interview_points){
    parts.push('<div class="sec"><h4><span class="sec-bar" style="background:#b78bff"></span>面试考点</h4><div class="af-b">'+fmtPoints(lk.interview_points)+'</div></div>');
  }
  if(!parts.length) return '';
  const head=inHub
    ? '<div class="pp-head">'+
      '<span class="tid">'+esc(t.id)+'</span><span class="pp-title" style="font-weight:550">'+esc(t.title)+'</span>'+
      '<span class="badge" style="color:'+(STATUS[t.status]||STATUS.todo).color+';border-color:'+(STATUS[t.status]||STATUS.todo).color+'44">'+(STATUS[t.status]||STATUS.todo).label+'</span>'+
      (ai&&ai.verdict==='approve'?'<span class="badge" style="color:var(--done);border-color:rgba(99,191,106,.4)">AI 通过</span>':'')+
      (ai&&ai.verdict==='reject'?'<span class="badge" style="color:var(--review);border-color:rgba(233,98,98,.4)">AI 打回</span>':'')+
      (ai&&r.ai_at?'<span class="muted mono" style="font-size:10.5px">审查于 '+fmt(r.ai_at)+'</span>':'')+
      '<button class="btn sm" style="margin-left:auto" onclick="closeModal();openDetail(&#39;'+esc(t.id)+'&#39;,&#39;review&#39;)">查看任务 →</button></div>'
    : '';
  return '<div class="propose cr-card" data-task="'+esc(t.id)+'">'+head+'<div class="pp-body" style="gap:0">'+parts.join('')+'</div></div>';
}

// 内容含多个要点（1. 2. 3. / ①②③ 等）时逐点换行展示；无编号则原文
function fmtPoints(text){
  const t=String(text||'');
  const parts=t.split(/(?=\d+[\.、\)]\s|[①-⑩]\s)/);
  if(parts.length<=1) return esc(t);
  return parts.map(function(p){
    p=p.trim();
    if(!p) return '';
    return '<div style="padding-left:13px;position:relative;margin:3px 0"><span style="position:absolute;left:0;color:var(--accent)">•</span>'+esc(p)+'</div>';
  }).join('');
}

const COMMANDS=[
  {ic:'⚡',label:'拆解需求 /decompose',k:'D',run:()=>openDecompose()},
  {ic:'◈',label:'打开影响分析台',k:'I',run:()=>openImpactStudio()},
  {ic:'✓',label:'打开 Review 队列',k:'R',run:()=>openReviewQueue()},
  {ic:ic('board',13),label:'切换到看板视图',k:'1',run:()=>setView('kanban')},
  {ic:ic('list',13),label:'切换到列表视图',k:'2',run:()=>setView('list')},
  {ic:'◇',label:'切换到依赖图',k:'3',run:()=>setView('graph')},
  {ic:'☾',label:'切换明暗主题',k:'T',run:()=>toggleTheme()},
  {ic:ic('clip',13),label:'需求管理',k:'',run:()=>openReqModal()},
  {ic:'＋',label:'新建任务',k:'N',run:()=>openNewTask()},
  {ic:'◑',label:'运行检查 /api/validate',k:'V',run:()=>showValidate()},
  {ic:ic('bell',13),label:'查看下游提醒',k:'',run:()=>showNotices()},
  {ic:ic('clock',13),label:'回看 · 记忆库',k:'',run:()=>openReplayHub()},
  {ic:'⚙',label:'AI Provider 设置',k:'',run:()=>manageProviders()}
];
function toggleCmdk(on){
  const el=$('#cmdk');
  if(on===false||(!on&&!el.classList.contains('hidden'))){ el.classList.add('hidden'); return; }
  el.classList.remove('hidden'); $('#cmdk-input').value=''; renderCmdk(''); $('#cmdk-input').focus();
}
function renderCmdk(q){
  q=(q||'').toLowerCase();
  const cmds=COMMANDS.filter(c=>c.label.toLowerCase().includes(q));
  const tasks=q?S.tasks.filter(t=>(t.id+' '+(t.title||'')).toLowerCase().includes(q)).slice(0,6):[];
  let html='';
  if(cmds.length) html+='<div style="font-size:10px;color:var(--text-3);padding:6px 11px;letter-spacing:.06em">命令</div>';
  html+=cmds.map((c,i)=>'<div class="cmditem '+(i===0?'sel':'')+'" onclick="COMMANDS['+COMMANDS.indexOf(c)+'].run();toggleCmdk(false)">'+
      '<span class="ic">'+c.ic+'</span>'+esc(c.label)+(c.k?'<span class="k">'+c.k+'</span>':'')+'</div>').join('');
  if(tasks.length) html+='<div style="font-size:10px;color:var(--text-3);padding:6px 11px;letter-spacing:.06em">任务</div>';
  html+=tasks.map(t=>'<div class="cmditem" onclick="toggleCmdk(false);openDetail(&#39;'+t.id+'&#39;,&#39;overview&#39;)">'+
      '<span class="ic" style="color:'+(STATUS[t.status]||STATUS.todo).color+'">'+(STATUS[t.status]||STATUS.todo).ico+'</span>'+
      '<span class="tid">'+t.id+'</span> '+esc(t.title)+'</div>').join('');
  $('#cmdk-list').innerHTML=html;
}
function setView(v){ S.view=v; $$('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.view===v)); render(); }
function toggleTheme(){
  const h=document.documentElement;
  const dark=h.dataset.theme!=='light';
  h.dataset.theme = dark?'light':'dark';
  $('#theme-btn').textContent = dark?'☀':'☾';
  try{ localStorage.setItem('vtp-theme', dark?'light':'dark'); }catch(e){}
  if(S.view==='graph') render();
}

/* ============================================================
   14. 数据加载 + 事件 + 启动
   ============================================================ */
async function refreshAll(){
  const tasks=await api('/api/tasks');
  S.tasks=tasks||[];
  Object.keys(taskCache).forEach(id=>{
    const fresh=S.tasks.find(t=>t.id===id);
    if(fresh) taskCache[id]=fresh;
  });
}
async function loadAll(){
  try{
    const cfg=await api('/api/config');
    if(cfg&&cfg.branch) S.branch=cfg.branch;
  }catch(e){}
  const branch=S.branch;
  const results=await Promise.allSettled([
    api(branch?('/api/tasks?branch='+encodeURIComponent(branch)):'/api/tasks'),
    api('/api/validate'),
    api('/api/requirements')
  ]);
  if(results[0].status==='fulfilled'){
    S.tasks=results[0].value||[];
    Object.keys(taskCache).forEach(id=>{
      const fresh=S.tasks.find(t=>t.id===id);
      if(fresh) taskCache[id]=fresh;
    });
  }else{
    toast('加载任务失败：'+results[0].reason.message,'err');
    S.tasks=[];
  }
  if(results[2].status==='fulfilled') S.requirements=results[2].value||[];
  if(results[1].status==='fulfilled') S.validate=results[1].value;
  S.syncAt=Date.now();
  tickSync();
  render();
}

function render(){
  // 定时刷新/数据更新时保持当前查看位置：主内容区 + 侧栏 + 看板各状态列内部滚动都不跳回开头
  const content=$('#content'), sb=document.querySelector('.sb-scroll');
  const st=content?{top:content.scrollTop,left:content.scrollLeft}:null;
  const sbSt=sb?sb.scrollTop:null;
  const colTops=Array.from(document.querySelectorAll('.col-body')).map(c=>c.scrollTop);
  renderSidebar(); renderFilterbar(); renderTop(); renderPlanBar(); renderNoticesBadge();
  const fn={kanban:renderKanban,list:renderList,graph:renderGraph}[S.view];
  if(fn) fn();
  if(content&&st){ content.scrollTop=st.top; content.scrollLeft=st.left; }
  if(sb&&sbSt!=null) sb.scrollTop=sbSt;
  if(colTops.length){ document.querySelectorAll('.col-body').forEach((c,i)=>{ if(colTops[i]!=null) c.scrollTop=colTops[i]; }); }
}

function agoText(ms){ const s=Math.floor((Date.now()-ms)/1000);
  if(s<10) return '刚刚'; if(s<60) return s+' 秒前';
  if(s<3600) return Math.floor(s/60)+' 分钟前'; return Math.floor(s/3600)+' 小时前'; }
function tickSync(){ const el=$('#sync-ago'); if(el) el.textContent=agoText(S.syncAt); }
function toggleTestMenu(){
  const body=$('#test-menu-body'), head=$('#test-menu'), caret=$('#test-caret');
  if(!body) return;
  const open=body.classList.toggle('hidden')===false;
  head.classList.toggle('open',open);
  caret.textContent=open?'▾':'▸';
}
function syncNow(){
  const el=$('#sync-ago'); if(el) el.textContent='同步中…';
  loadAll().then(()=>{ toast('已重新读取 tasks/ 目录，'+S.tasks.length+' 个任务','ok'); });
}

/* ---------- 简易对话框 ---------- */
function showTextareaDialog(title,placeholder,defaultValue,onOk){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:300;';
  const box=document.createElement('div');
  box.style.cssText='background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-lg);padding:20px;width:480px;max-width:92vw;';
  box.innerHTML='<h3 style="margin-bottom:12px;color:var(--text);font-size:15px">'+esc(title)+'</h3>'+
    '<textarea id="textarea-dialog" placeholder="'+esc(placeholder||'')+'" style="width:100%;min-height:140px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;resize:vertical;box-sizing:border-box">'+esc(defaultValue||'')+'</textarea>'+
    '<div style="display:flex;gap:10px;margin-top:12px;justify-content:center"><button id="ta-ok" class="btn primary" style="justify-content:center;min-width:84px;padding:6px 22px">确定</button><button id="ta-cancel" class="btn" style="justify-content:center;min-width:84px;padding:6px 22px">取消</button></div>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  const ta=document.getElementById('textarea-dialog');
  if(ta) ta.focus();
  document.getElementById('ta-ok').onclick=function(){ overlay.remove(); if(onOk) onOk(ta.value); };
  document.getElementById('ta-cancel').onclick=function(){ overlay.remove(); };
  overlay.addEventListener('click',function(e){ if(e.target===overlay) overlay.remove(); });
}
function showInputDialog(title,placeholder,defaultValue,onOk){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:300;';
  const box=document.createElement('div');
  box.style.cssText='background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-lg);padding:20px;width:400px;max-width:92vw;';
  box.innerHTML='<h3 style="margin-bottom:12px;color:var(--text);font-size:15px">'+esc(title)+'</h3>'+
    '<input id="input-dialog" type="text" placeholder="'+esc(placeholder||'')+'" value="'+esc(defaultValue||'')+'" style="width:100%;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px">'+
    '<div style="display:flex;gap:8px"><button id="input-ok" class="btn primary" style="flex:1">确定</button><button id="input-cancel" class="btn" style="flex:1">取消</button></div>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  const input=document.getElementById('input-dialog');
  if(input){ input.focus(); input.select(); }
  const close=function(){ overlay.remove(); };
  document.getElementById('input-ok').onclick=function(){ close(); if(onOk) onOk(input.value); };
  document.getElementById('input-cancel').onclick=close;
  overlay.addEventListener('click',function(e){ if(e.target===overlay) close(); });
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){ close(); if(onOk) onOk(input.value); }
    if(e.key==='Escape') close();
  });
}

/* ---------- 事件绑定 ---------- */
$$('.seg button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
$$('.nav-item[data-scope]').forEach(n=>n.onclick=()=>{
  $$('.nav-item[data-scope]').forEach(x=>x.classList.remove('active'));
  n.classList.add('active'); S.scope=n.dataset.scope; S.req=''; render();
});
$('#q').oninput=e=>{ S.q=e.target.value; render(); };
$('#theme-btn').onclick=toggleTheme;
$('#cmdk-input').oninput=e=>renderCmdk(e.target.value);
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test((document.activeElement&&document.activeElement.tagName)||'');
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){ e.preventDefault(); toggleCmdk(); return; }
  if(e.key==='Escape'){ toggleCmdk(false); closeModal();
    if(!$('#lightbox').classList.contains('hidden')){ closeLightbox(); return; }
    if(!$('#drawer').classList.contains('hidden')) closeDrawer(); return; }
  if(typing) return;
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='1') setView('kanban');
  if(e.key==='2') setView('list');
  if(e.key==='3') setView('graph');
  if(e.key.toLowerCase()==='d') openDecompose();
  if(e.key.toLowerCase()==='i') openImpactStudio();
  if(e.key.toLowerCase()==='r') openReviewQueue();
  if(e.key.toLowerCase()==='t') toggleTheme();
  if(e.key.toLowerCase()==='n'){ e.preventDefault(); openNewTask(); }
  if(e.key.toLowerCase()==='v') showValidate();
  if(!$('#drawer').classList.contains('hidden')){
    if(e.key==='j') siblingTask(1);
    if(e.key==='k') siblingTask(-1);
  }
});

/* ---------- 主题 ---------- */
(function(){
  let saved='dark';
  try{ saved=localStorage.getItem('vtp-theme')||'dark'; }catch(e){}
  document.documentElement.setAttribute('data-theme',saved);
  $('#theme-btn').textContent = saved==='light'?'☀':'☾';
})();

/* ---------- 代码主题（跟随界面 / Xcode 深色 / Xcode 浅色） ---------- */
const CODE_THEMES={auto:'跟随界面','xcode-dark':'Xcode 深色','xcode-light':'Xcode 浅色'};
let codeTheme='auto';
try{ codeTheme=localStorage.getItem('vtp-code-theme')||'auto'; }catch(e){}
document.documentElement.setAttribute('data-code-theme',codeTheme);
function cycleCodeTheme(){
  const keys=Object.keys(CODE_THEMES);
  const i=keys.indexOf(codeTheme);
  codeTheme=keys[(i+1)%keys.length];
  document.documentElement.setAttribute('data-code-theme',codeTheme);
  try{ localStorage.setItem('vtp-code-theme',codeTheme); }catch(e){}
  toast('代码主题：'+CODE_THEMES[codeTheme],'info');
}

/* ---------- 启动 ---------- */
loadAll();
setInterval(function(){ loadAll(); }, 5000);
setInterval(tickSync, 15000);
</script>
